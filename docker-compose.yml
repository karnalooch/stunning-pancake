version: '3.8'

services:
  # Database: TimescaleDB + PostGIS (Constitution §24.3 — Time-Series Hypertables)
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: sport_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sport_db}
      POSTGRES_USER: ${POSTGRES_USER:-sport_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sport_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis for high-speed caching and leaderboard Sorted Sets
  redis:
    image: redis:7-alpine
    container_name: sport_redis
    restart: always
    ports:
      - "6379:6379"

  # BRouter for track validation and anti-cheat (Topological matching)
  brouter:
    build: ./infrastructure/brouter/brouter-src
    container_name: sport_brouter
    restart: always
    ports:
      - "17777:17777"
    volumes:
      - ./infrastructure/brouter/segments4:/segments4:ro





  # Traccar for real-time telemetry collection
  traccar:
    image: traccar/traccar:latest
    container_name: sport_traccar
    restart: always
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    volumes:
      - ./infrastructure/traccar/conf/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - ./infrastructure/traccar/logs:/opt/traccar/logs
    depends_on:
      - db
      - redis
      - brouter

  # Backend API (Django)
  backend:
    build: ./backend
    container_name: sport_backend
    restart: always
    command: sh -c "python manage.py makemigrations users activities && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-key}
      DATABASE_URL: postgres://${POSTGRES_USER:-sport_user}:${DB_PASSWORD:-sport_password_2026}@db:5432/${POSTGRES_DB:-sport_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - traccar

  # Telemetry Microservice (FastAPI — Constitution §24.1)
  telemetry:
    build: ./telemetry
    container_name: sport_telemetry
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sport_user}:${DB_PASSWORD:-sport_password_2026}@db:5432/${POSTGRES_DB:-sport_db}
    depends_on:
      - db

  # Admin Dashboard (React/Vite)
  admin:
    build: ./admin
    container_name: sport_admin
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Celery Worker — Async tasks: BRouter validation, notifications (Phase 7)
  celery_worker:
    build: ./backend
    container_name: sport_celery_worker
    restart: always
    command: celery -A core worker -Q critical,notifications -l info --concurrency=4
    environment:
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-key}
      DATABASE_URL: postgres://${POSTGRES_USER:-sport_user}:${DB_PASSWORD:-sport_password_2026}@db:5432/${POSTGRES_DB:-sport_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

volumes:
  pgdata:
