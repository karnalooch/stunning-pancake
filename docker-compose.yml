version: '3.8'

services:
  # Database: TimescaleDB + PostGIS (Constitution §24.3 — Time-Series Hypertables)
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: 4velo_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?err_POSTGRES_DB_not_set}
      POSTGRES_USER: ${POSTGRES_USER:?err_POSTGRES_USER_not_set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err_DB_PASSWORD_not_set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis for high-speed caching and leaderboard Sorted Sets
  redis:
    image: redis:7-alpine
    container_name: 4velo_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # BRouter for track validation and anti-cheat (Topological matching)
  brouter:
    profiles: ["routing", "simulation"]
    build:
      context: .
      dockerfile: infrastructure/brouter/Dockerfile
    container_name: 4velo_brouter
    restart: always
    ports:
      - "17777:17777"
    volumes:
      - ./infrastructure/brouter/segments4:/brouter/segments4:ro

  # OSRM — live simulator routing (BSD engine; OSM ODbL). First start builds graph in volume.
  osrm:
    profiles: ["routing", "simulation"]
    build:
      context: .
      dockerfile: infrastructure/osrm/Dockerfile
    container_name: 4velo_osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data
    environment:
      OSRM_PBF_URL: ${OSRM_PBF_URL:-https://download.geofabrik.de/europe/poland-latest.osm.pbf}

  # Traccar for real-time telemetry collection
  traccar:
    profiles: ["tracking"]
    image: traccar/traccar:latest
    container_name: 4velo_traccar
    restart: always
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    volumes:
      - ./infrastructure/traccar/conf/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      TRACCAR_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
      - redis
      - brouter

  # Backend API (Django)
  backend:
    build: ./backend
    container_name: 4velo_backend
    restart: always
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:?err_SECRET_KEY_not_set}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_BURST_MODE: ${EVENT_BURST_MODE:-auto}
      EVENT_BURST_AUTO_MIN_PARTICIPANTS: ${EVENT_BURST_AUTO_MIN_PARTICIPANTS:-1000}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
      BROUTER_URL: ${BROUTER_URL:-http://brouter:17777/brouter}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      SCALE_SIM_ROUTING_BACKEND: ${SCALE_SIM_ROUTING_BACKEND:-osrm}
      TRACCAR_URL: ${TRACCAR_URL:-http://traccar:8082}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Telemetry Microservice (FastAPI — Constitution §24.1)
  telemetry:
    build: ./telemetry
    container_name: 4velo_telemetry
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRACCAR_REDIS_CHANNEL: ${TRACCAR_REDIS_CHANNEL:-traccar:positions}
      TELEMETRY_INGEST_JWT_REQUIRED: ${TELEMETRY_INGEST_JWT_REQUIRED:-1}
      TELEMETRY_INGEST_JWT_SECRET: ${TELEMETRY_INGEST_JWT_SECRET:?err_TELEMETRY_INGEST_JWT_SECRET_not_set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 1. Global Admin Application (Port 3001)
  global_admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        - VITE_APP_MODE=GLOBAL_ADMIN
        - VITE_API_URL
        - VITE_LLM_API_KEY
        - VITE_LLM_API_URL
        - VITE_LLM_MODEL
    container_name: 4velo_global_admin
    restart: always
    environment:
      PORT: "80"
    ports:
      - "3001:80"
    depends_on:
      - backend

  # 2. Tenant Admin Application (Port 3002)
  tenant_admin:
    profiles: ["all-admin"]
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        - VITE_APP_MODE=LOCAL_ADMIN
        - VITE_API_URL
        - VITE_LLM_API_KEY
        - VITE_LLM_API_URL
        - VITE_LLM_MODEL
    container_name: 4velo_tenant_admin
    restart: always
    environment:
      PORT: "80"
    ports:
      - "3002:80"
    depends_on:
      - backend

  # 3. Moderator Application (Port 3003)
  moderator:
    profiles: ["all-admin"]
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        - VITE_APP_MODE=MODERATOR
        - VITE_API_URL
        - VITE_LLM_API_KEY
        - VITE_LLM_API_URL
        - VITE_LLM_MODEL
    container_name: 4velo_moderator
    restart: always
    environment:
      PORT: "80"
    ports:
      - "3003:80"
    depends_on:
      - backend

  # Celery Worker — critical / default / notifications (no simulation)
  celery_worker:
    build: ./backend
    container_name: 4velo_celery_worker
    restart: always
    command: celery -A core worker -Q critical,notifications,default -l info --concurrency=4
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:?err_SECRET_KEY_not_set}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  # Celery Worker — batch + live simulator only (queue: simulation)
  celery_worker_simulation:
    profiles: ["simulation"]
    build: ./backend
    container_name: 4velo_celery_simulation
    restart: always
    command: celery -A core worker -Q simulation -l info --concurrency=6 --hostname=simulation@%h
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:?err_SECRET_KEY_not_set}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BROUTER_URL: ${BROUTER_URL:-http://brouter:17777/brouter}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
      SCALE_SIM_ROUTING_BACKEND: ${SCALE_SIM_ROUTING_BACKEND:-osrm}
      CELERY_WORKER_CONCURRENCY: "6"
      CELERY_WORKER_QUEUES: simulation
      SCALE_AUTO_DISK_GUARD: "true"
      SCALE_AUTO_WIPE_BEFORE_BATCH: "true"
      SCALE_BATCH_PARALLEL_CITIES: "true"
      SCALE_BATCH_MAX_PARALLEL_WORKERS: "6"
      SCALE_SKIP_DEPT_ON_BATCH: "true"
      SCALE_BATCH_FAST_INSERT: "true"
      DATABASE_CONN_MAX_AGE: "60"
      SCALE_LIVE_POOL_MAX_REDIS: "50000"
      SCALE_SKIP_GLOBAL_LIVE_POOL_ABOVE: "50000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - brouter
      - osrm

  # Celery Beat — periodic task scheduler
  celery_beat:
    build: ./backend
    container_name: 4velo_celery_beat
    restart: always
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:?err_SECRET_KEY_not_set}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  osrm_data:
