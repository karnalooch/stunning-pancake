version: '3.8'

services:
  # Database: TimescaleDB + PostGIS (Constitution §24.3 — Time-Series Hypertables)
  db:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: sport_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?err_POSTGRES_DB_not_set}
      POSTGRES_USER: ${POSTGRES_USER:?err_POSTGRES_USER_not_set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?err_DB_PASSWORD_not_set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis for high-speed caching and leaderboard Sorted Sets
  redis:
    image: redis:7-alpine
    container_name: sport_redis
    restart: always
    ports:
      - "6379:6379"

  # BRouter for track validation and anti-cheat (Topological matching)
  brouter:
    build: ./infrastructure/brouter/brouter-src
    container_name: sport_brouter
    restart: always
    ports:
      - "17777:17777"
    volumes:
      - ./infrastructure/brouter/segments4:/segments4:ro





  # Traccar for real-time telemetry collection
  traccar:
    image: traccar/traccar:latest
    container_name: sport_traccar
    restart: always
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150"
      - "5000-5150:5000-5150/udp"
    volumes:
      - ./infrastructure/traccar/conf/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      TRACCAR_DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
      - redis
      - brouter

  # Backend API (Django)
  backend:
    build: ./backend
    container_name: sport_backend
    restart: always
    command: sh -c "python manage.py makemigrations users activities && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:?err_SECRET_KEY_not_set}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
      BROUTER_URL: ${BROUTER_URL:-http://brouter:17777/brouter}
      TRACCAR_URL: ${TRACCAR_URL:-http://traccar:8082}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
      - traccar

  # Telemetry Microservice (FastAPI — Constitution §24.1)
  telemetry:
    build: ./telemetry
    container_name: sport_telemetry
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRACCAR_REDIS_CHANNEL: ${TRACCAR_REDIS_CHANNEL:-traccar:positions}
    depends_on:
      - db
      - redis

  # Public Landing Page (Port 3000 — The "Miracle" View)
  web:
    build: ./web
    container_name: sport_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 1. Global Admin Application (Port 3001)
  global_admin:
    build:
      context: ./admin
      args:
        - VITE_APP_MODE=GLOBAL_ADMIN
    container_name: sport_global_admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

  # 2. Tenant Admin Application (Port 3002)
  tenant_admin:
    build:
      context: ./admin
      args:
        - VITE_APP_MODE=LOCAL_ADMIN
    container_name: sport_tenant_admin
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - backend

  # 3. Moderator Application (Port 3003)
  moderator:
    build:
      context: ./admin
      args:
        - VITE_APP_MODE=MODERATOR
    container_name: sport_moderator
    restart: always
    ports:
      - "3003:80"
    depends_on:
      - backend

  # Celery Worker — Async tasks: BRouter validation, notifications (Phase 7)
  celery_worker:
    build: ./backend
    container_name: sport_celery_worker
    restart: always
    command: celery -A core worker -Q critical,notifications -l info --concurrency=4
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  # Celery Beat — periodic task scheduler
  celery_beat:
    build: ./backend
    container_name: sport_celery_beat
    restart: always
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

volumes:
  pgdata:
