pmOnFail: ignore

# pnpm 11+ reads project settings from pnpm-workspace.yaml, not .npmrc.
# Expo SDK 55 supports pnpm's isolated linker. Keep workspaces isolated so
# admin React cannot leak into the mobile dependency graph / Metro / Jest.
nodeLinker: isolated

# Keep pnpm's isolated linker and the standard node_modules/.pnpm virtual-store
# location that Expo/Metro expects, while shortening generated package paths on
# Windows so React Native CMake/Ninja object paths stay within safe limits.
virtualStoreDirMaxLength: 40

overrides:
  shell-quote: 1.10.0
  tar: 7.5.21
  '@xmldom/xmldom@>=0.7.0 <0.9.0': 0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.10.0': 0.9.12
  'brace-expansion@<2.0.0': 1.1.18
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=3.0.0 <6.0.0': 5.0.9
  browserslist: 4.28.7
  fast-uri: 3.1.6
  form-data: 4.0.6
  'js-yaml@<4.0.0': 3.15.2
  'js-yaml@>=4.0.0 <5.0.0': 4.3.2
  linkify-it: 5.0.2
  nanoid: 3.3.18
  postcss: 8.5.23
  svgo: 3.3.5
  'undici@>=6.0.0 <7.0.0': 6.28.0
  'undici@>=7.0.0 <8.0.0': 7.29.0
  baseline-browser-mapping: 2.11.0
  'protobufjs@>=7.5.0 <8.0.0': 7.6.5
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  'ts-jest>esbuild': 0.28.1
  'xcode>uuid': 11.1.1
  'query-string>decode-uri-component': 0.5.0
  image-size: npm:image-size-next@1.2.2

# pnpm 12 blocks dependency lifecycle scripts unless each package is reviewed.
# Keep approvals version-scoped so dependency upgrades require a fresh decision.
allowBuilds:
  '@shopify/react-native-skia@2.4.18': true
  'electron@44.4.1': true
  'electron-winstaller@5.4.0': true
  'esbuild@0.25.12 || 0.28.1': false
  'protobufjs@7.6.5': false
  'unrs-resolver@1.12.2': false

packages:
  - "admin"
  - "mobile"
  - "packages/*"
