packages:
  - "admin"
  - "mobile"
  - "packages/*"

# Keep pnpm 12 lockfiles single-document until GitHub/Dependabot fully support
# the environment lockfile document (dependabot/dependabot-core#15904).
pmOnFail: ignore

overrides:
  react: 19.2.7
  react-dom: 19.2.7

# pnpm 12 runs dependency lifecycle scripts only after explicit review.
# Pin exact resolved versions so dependency upgrades cannot inherit approval.
allowBuilds:
  '@shopify/react-native-skia@2.4.18': true
  'electron-winstaller@5.4.0': true
  'electron@41.7.1': true
  'esbuild@0.25.12': true
  'esbuild@0.28.0': true
  'protobufjs@7.6.2': true
  'unrs-resolver@1.12.2': true
