version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_DB: 4velo_db
      POSTGRES_USER: 4velo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  brouter:
    image: nilsnolde/brouter:latest
    restart: always

  traccar:
    image: traccar/traccar:latest
    restart: always
    volumes:
      - ./infrastructure/traccar/conf/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      DEBUG: 0
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://4velo_user:${DB_PASSWORD}@db:5432/4velo_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./admin/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
