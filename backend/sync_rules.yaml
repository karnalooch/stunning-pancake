bucket_definitions:
  # Users only sync their own data
  user_data:
    parameters: [user_id]
    data_queries:
      - SELECT * FROM activities_activity WHERE user_id = :user_id
      - SELECT * FROM activities_privacyzone WHERE user_id = :user_id

  # Users sync POIs for their tenant
  tenant_data:
    parameters: [tenant_id]
    data_queries:
      - SELECT * FROM activities_poi WHERE tenant_id = :tenant_id
      - SELECT * FROM activities_voucher WHERE poi_id IN (SELECT id FROM activities_poi WHERE tenant_id = :tenant_id)

  # Global data (e.g. global leaderboards)
  global_data:
    data_queries:
      - SELECT id, name, logo FROM users_tenant WHERE is_active = true
