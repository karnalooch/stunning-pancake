[project]
name = "4velo-backend"
version = "2.0.0"
description = "4VELO Platform — Django Backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "activities/migrations/0009_add_poi_category_and_wearable_integration.py",
    "users/migrations/0008_add_stripe_fields.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments (Django signals pattern)
    # Style debt — tracked separately; avoid blocking deploy CI on whitespace/import order.
    "W293",
    "W291",
    "E402",
    "SIM",
    "F841",
    "B",
]

[tool.ruff.lint.per-file-ignores]
"core/settings.py" = ["E402"]
"run_dev.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["activities", "clubs", "core", "events", "rewards", "users"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.coverage.run]
source = ["core", "activities"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "run_dev.py", "run_pytest.py"]

[tool.coverage.report]
# Phased goal: raise toward 80% (see docs/quality/BACKLOG.md Q-P2-3)
fail_under = 40
show_missing = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short -q"
markers = [
    "simulator_light: fast simulator tests; mocked broker/FSM; safe on laptop",
    "simulator_integration: simulator tests that may touch Redis (optional, future)",
]
