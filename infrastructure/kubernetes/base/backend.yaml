apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sport
      tier: backend
  template:
    metadata:
      labels:
        app: sport
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tier
                  operator: In
                  values:
                  - backend
              topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 2000
      containers:
      - name: django
        image: sport-backend:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8000
        env:
        - name: CELERY_BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: sport-config
              key: CELERY_BROKER_URL
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: sport-backend-service
spec:
  selector:
    app: sport
    tier: backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
