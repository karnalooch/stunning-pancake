apiVersion: v1
kind: ConfigMap
metadata:
  name: sport-config
spec:
  data:
    CELERY_BROKER_URL: "redis://redis-service:6379/0"
    EXPO_PUBLIC_TELEMETRY_URL: "https://api.sport-platform.com"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sport-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sport-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
