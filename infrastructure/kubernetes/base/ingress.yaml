apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sport-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.sport-platform.com
    - admin.sport-platform.com
    secretName: sport-tls-certs
  rules:
  - host: api.sport-platform.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sport-backend-service
            port:
              number: 80
  - host: admin.sport-platform.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sport-admin-service
            port:
              number: 80
