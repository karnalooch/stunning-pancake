# ==============================================================================
# SECRETS — DO NOT store actual secret values in this file or in version control.
#
# These Secret resources must be created out-of-band on each target cluster
# before applying this kustomization. The manifests below show only the
# required key names; all data fields are intentionally left empty.
#
# Create sport-db-secret (used by backend and telemetry for DATABASE_URL):
#   kubectl create secret generic sport-db-secret \
#     --from-literal=database-url="postgres://sport_app:<password>@db-service:5432/sport"
#
# Create sport-db-credentials (used by the TimescaleDB container for POSTGRES_PASSWORD):
#   kubectl create secret generic sport-db-credentials \
#     --from-literal=postgres-password="<password>"
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sport-db-secret
type: Opaque
data:
  # base64-encoded value is injected at deploy time — do not commit real values here.
  # database-url: <base64-encoded connection string>
---
apiVersion: v1
kind: Secret
metadata:
  name: sport-db-credentials
type: Opaque
data:
  # base64-encoded value is injected at deploy time — do not commit real values here.
  # postgres-password: <base64-encoded password>
