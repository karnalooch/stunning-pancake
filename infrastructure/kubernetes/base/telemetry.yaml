apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sport
      tier: telemetry
  template:
    metadata:
      labels:
        app: sport
        tier: telemetry
    spec:
      containers:
      - name: fastapi
        image: sport-telemetry:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          value: postgres://sport_app:sportpass@db-service:5432/sport
        - name: REDIS_URL
          value: redis://redis-service:6379/0
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: sport-telemetry-service
spec:
  selector:
    app: sport
    tier: telemetry
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
