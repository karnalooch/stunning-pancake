apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-owner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sport
      tier: owner
  template:
    metadata:
      labels:
        app: sport
        tier: owner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
      - name: nginx
        image: sport-owner:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sport-owner-service
spec:
  selector:
    app: sport
    tier: owner
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
