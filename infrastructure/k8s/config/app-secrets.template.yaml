apiVersion: v1
kind: Secret
metadata:
  name: sport-app-secrets
type: Opaque
stringData:
  # Required
  SECRET_KEY: "replace-me"
  DATABASE_URL: "postgres://user:password@postgres-host:5432/sport_db"

  # Optional integrations
  SENTRY_DSN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  SENDGRID_API_KEY: ""
  FROM_EMAIL: "no-reply@example.com"

  # Optional auth integrations
  STRAVA_CLIENT_ID: ""
  STRAVA_CLIENT_SECRET: ""
  GARMIN_CLIENT_ID: ""
  GARMIN_CLIENT_SECRET: ""

  # Optional Matrix integration
  MATRIX_HOMESERVER: ""
  MATRIX_TOKEN: ""
