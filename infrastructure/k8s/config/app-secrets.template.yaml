apiVersion: v1
kind: Secret
metadata:
  name: sport-app-secrets
type: Opaque
stringData:
  # Required runtime credentials
  SECRET_KEY: "replace-me"
  # NOSUPERUSER/NOBYPASSRLS serving role. Schema-owner credentials live only
  # in migration-secrets.template.yaml.
  DATABASE_URL: "REPLACE_ME_RUNTIME_DATABASE_URL"

  # Optional integrations
  SENTRY_DSN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  SENDGRID_API_KEY: ""
  FROM_EMAIL: "no-reply@example.com"

  # Optional auth integrations
  STRAVA_CLIENT_ID: ""
  STRAVA_CLIENT_SECRET: ""
  GARMIN_CLIENT_ID: ""
  GARMIN_CLIENT_SECRET: ""

  # Optional Matrix integration
  MATRIX_HOMESERVER: ""
  MATRIX_TOKEN: ""
