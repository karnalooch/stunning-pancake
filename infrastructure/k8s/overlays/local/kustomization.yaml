apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../
  - ../../workloads/admin.optional.yaml
  - ../../optional/postgres.optional.yaml
  - ../../optional/telemetry.optional.yaml
  - ../../optional/traccar.optional.yaml

images:
  - name: ghcr.io/your-org/sport-backend
    newName: localhost/sport-backend
    newTag: gold-master-v2.1
  - name: ghcr.io/your-org/sport-admin
    newName: localhost/sport-owner
    newTag: gold-master-v2.1

patches:
  - path: patches/replicas-local.yaml
