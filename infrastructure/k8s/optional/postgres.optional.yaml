apiVersion: v1
kind: Service
metadata:
  name: sport-postgres
  labels:
    app: sport-postgres
spec:
  selector:
    app: sport-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sport-postgres
  labels:
    app: sport-postgres
spec:
  serviceName: sport-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sport-postgres
  template:
    metadata:
      labels:
        app: sport-postgres
    spec:
      containers:
        - name: postgres
          image: timescale/timescaledb-ha:pg15-latest
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: sport_db
            - name: POSTGRES_USER
              value: sport_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sport-postgres-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: sport-postgres-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-me"
