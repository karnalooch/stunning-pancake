apiVersion: v1
kind: Service
metadata:
  name: sport-admin
  labels:
    app: sport-admin
spec:
  selector:
    app: sport-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-admin
  labels:
    app: sport-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sport-admin
  template:
    metadata:
      labels:
        app: sport-admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/your-org/sport-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
