apiVersion: v1
kind: Service
metadata:
  name: sport-backend-api
  labels:
    app: sport-backend-api
spec:
  selector:
    app: sport-backend-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sport-backend-api
  labels:
    app: sport-backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sport-backend-api
  template:
    metadata:
      labels:
        app: sport-backend-api
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/sport-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - gunicorn
            - --bind
            - 0.0.0.0:8000
            - --workers
            - "3"
            - core.wsgi:application
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sport-app-config
            - secretRef:
                name: sport-app-secrets
          readinessProbe:
            httpGet:
              path: /api/infra/health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/infra/health/
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
