apiVersion: batch/v1
kind: Job
metadata:
  name: sport-backend-migrate
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/your-org/sport-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - python manage.py migrate --no-input
          envFrom:
            - configMapRef:
                name: sport-app-config
            - secretRef:
                name: sport-app-secrets
