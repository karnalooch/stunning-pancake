# Sim-lab overlay — isolated load-test profile (300k users / 50k ACTIVE targets).
#
#   docker compose --env-file .env.sim-lab \
#     -f docker-compose.yml \
#     -f infrastructure/sim-lab/docker-compose.sim-lab.yml \
#     up -d db redis brouter osrm backend telemetry celery_worker celery_worker_simulation
#
# Optional admin UI:
#   ... up -d global_admin

services:
  backend:
    environment:
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-sim-lab}
      SCALE_MAX_CONCURRENT_RIDERS: ${SCALE_MAX_CONCURRENT_RIDERS:-50000}
      SCALE_MAX_TELEMETRY_PUBLISH: ${SCALE_MAX_TELEMETRY_PUBLISH:-50000}
      SCALE_OVERRIDE_MAX_STARTS_HARD_CAP: ${SCALE_OVERRIDE_MAX_STARTS_HARD_CAP:-1000}
      SCALE_OVERRIDE_MAX_BROUTER_CALLS_HARD_CAP: ${SCALE_OVERRIDE_MAX_BROUTER_CALLS_HARD_CAP:-500}
      SCALE_POSTGRES_DISK_BUDGET_GB: ${SCALE_POSTGRES_DISK_BUDGET_GB:-30}
      TELEMETRY_URL: ${TELEMETRY_URL:-http://telemetry:8001}

  celery_worker_simulation:
    environment:
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-sim-lab}
      SCALE_MAX_BATCH_USERS: ${SCALE_MAX_BATCH_USERS:-350000}
      SCALE_MAX_LIVE_POOL: ${SCALE_MAX_LIVE_POOL:-350000}
      SCALE_MAX_CONCURRENT_RIDERS: ${SCALE_MAX_CONCURRENT_RIDERS:-50000}
      SCALE_MAX_TELEMETRY_PUBLISH: ${SCALE_MAX_TELEMETRY_PUBLISH:-50000}
      SCALE_LIVE_POOL_MAX_REDIS: ${SCALE_LIVE_POOL_MAX_REDIS:-50000}
      SCALE_MAX_STARTS_PER_LIVE_TICK: ${SCALE_MAX_STARTS_PER_LIVE_TICK:-1000}
      SCALE_SIM_BROUTER_MAX_CALLS_PER_TICK: ${SCALE_SIM_BROUTER_MAX_CALLS_PER_TICK:-500}
      SCALE_SIM_BROUTER_ROUTE_ATTEMPTS: ${SCALE_SIM_BROUTER_ROUTE_ATTEMPTS:-4}
      SCALE_SIM_MAX_PIPELINE_ABSOLUTE: ${SCALE_SIM_MAX_PIPELINE_ABSOLUTE:-55000}
      SCALE_POSTGRES_DISK_BUDGET_GB: ${SCALE_POSTGRES_DISK_BUDGET_GB:-30}
      SCALE_AUTO_WIPE_BEFORE_BATCH: ${SCALE_AUTO_WIPE_BEFORE_BATCH:-true}
      SCALE_AUTO_DISK_GUARD: ${SCALE_AUTO_DISK_GUARD:-true}

  celery_worker:
    environment:
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-sim-lab}
      SCALE_POSTGRES_DISK_BUDGET_GB: ${SCALE_POSTGRES_DISK_BUDGET_GB:-30}

  telemetry:
    environment:
      TELEMETRY_SHARD_COUNT: ${TELEMETRY_SHARD_COUNT:-4}
      TELEMETRY_INGEST_BATCH_SIZE: ${TELEMETRY_INGEST_BATCH_SIZE:-200}
      TELEMETRY_DB_POOL_MAX: ${TELEMETRY_DB_POOL_MAX:-30}
      GLOBAL_MAX_INGEST_PER_SECOND: ${GLOBAL_MAX_INGEST_PER_SECOND:-60000}
