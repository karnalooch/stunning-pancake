appId: com.sport.athlete
---
# Canonical exact-SHA Ride visual proof.
# The PowerShell wrapper owns install/clear/ADB launch; this flow owns UI transitions only.
- runFlow:
    file: complete-onboarding.yaml

- extendedWaitUntil:
    visible:
      id: "home-open-start-ride"
    timeout: 30000
- takeScreenshot: 01_today

- tapOn:
    id: "home-open-start-ride"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "start-ride-primary"
    timeout: 12000
- takeScreenshot: 02_start_ride

- tapOn:
    id: "start-ride-primary"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "ride-pause-button"
    timeout: 20000
- takeScreenshot: 03_active_ride

- tapOn:
    id: "ride-pause-button"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "ride-paused-stop"
    timeout: 12000
- takeScreenshot: 04_paused

- tapOn:
    id: "ride-paused-stop"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "ride-summary-screen"
    timeout: 25000
- takeScreenshot: 05_summary

- tapOn:
    id: "ride-summary-back-home"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "home-open-start-ride"
    timeout: 15000
- takeScreenshot: 06_today_after_summary
