appId: com.sport.athlete
---
# Fresh exact-SHA proof state is established by the wrapper with pm clear.
# Prefer stable test IDs; visible copy is deliberately not part of this contract.
- extendedWaitUntil:
    visible:
      id: "onboarding-city-option"
    timeout: 45000

- tapOn:
    id: "onboarding-city-option"
    index: 0
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: "onboarding-city-next"
      enabled: true
    timeout: 12000
- tapOn:
    id: "onboarding-city-next"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: "onboarding-department-skip"
    timeout: 30000
- tapOn:
    id: "onboarding-department-skip"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: "onboarding-finish-join"
      enabled: true
    timeout: 12000
- tapOn:
    id: "onboarding-finish-join"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      id: "home-open-start-ride"
    timeout: 30000
