services:
  backend:
    environment:
      TELEMETRY_SHARD_COUNT: ${TELEMETRY_SHARD_COUNT:-4}
      REDIS_TELEMETRY_SHARD_NODES: ${REDIS_TELEMETRY_SHARD_NODES}
      GLOBAL_MAX_INGEST_PER_SECOND: ${GLOBAL_MAX_INGEST_PER_SECOND:-60000}
      BROUTER_URL: http://brouter:17777/brouter
  telemetry:
    environment:
      GLOBAL_MAX_INGEST_PER_SECOND: ${GLOBAL_MAX_INGEST_PER_SECOND:-60000}
      TELEMETRY_INGEST_BATCH_SIZE: ${TELEMETRY_INGEST_BATCH_SIZE:-200}
      # Benchmark profile (local load test): set TELEMETRY_SKIP_DB=1 TELEMETRY_SKIP_BROADCAST=1
      TELEMETRY_SKIP_DB: ${TELEMETRY_SKIP_DB:-0}
      TELEMETRY_SKIP_BROADCAST: ${TELEMETRY_SKIP_BROADCAST:-0}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
  celery_worker_simulation:
    environment:
      TELEMETRY_SHARD_COUNT: ${TELEMETRY_SHARD_COUNT:-4}
      REDIS_TELEMETRY_SHARD_NODES: ${REDIS_TELEMETRY_SHARD_NODES}
      BROUTER_URL: http://brouter:17777/brouter
      # Local stack has no celery-worker-routing; sync tick + grid routes for map warm-up.
      SCALE_SIM_ASYNC_ROUTING: "0"
      SCALE_SIM_SKIP_BROUTER: "1"
      SCALE_SIM_STRICT_ROAD_ROUTES: "0"

  brouter:
    environment:
      BROUTER_SEGMENT_PRESET: minimal
