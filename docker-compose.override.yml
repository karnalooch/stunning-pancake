services:
  backend:
    environment:
      TELEMETRY_SHARD_COUNT: ${TELEMETRY_SHARD_COUNT:-4}
      REDIS_TELEMETRY_SHARD_NODES: ${REDIS_TELEMETRY_SHARD_NODES}
      GLOBAL_MAX_INGEST_PER_SECOND: ${GLOBAL_MAX_INGEST_PER_SECOND:-60000}
  telemetry:
    environment:
      GLOBAL_MAX_INGEST_PER_SECOND: ${GLOBAL_MAX_INGEST_PER_SECOND:-60000}
      TELEMETRY_INGEST_BATCH_SIZE: ${TELEMETRY_INGEST_BATCH_SIZE:-200}
  celery_worker_simulation:
    environment:
      TELEMETRY_SHARD_COUNT: ${TELEMETRY_SHARD_COUNT:-4}
      REDIS_TELEMETRY_SHARD_NODES: ${REDIS_TELEMETRY_SHARD_NODES}

  brouter:
    environment:
      BROUTER_SEGMENT_PRESET: minimal
