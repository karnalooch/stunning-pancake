# Monorepo tooling — shared Ruff scope for all Python packages.
# Per-package overrides: backend/pyproject.toml (Django apps).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stricter than backend/pyproject.toml ignore debt — used for telemetry + scripts CI.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
# Asset CLI: argparse + sys.path before local imports
"scripts/generate_assets.py" = ["E402"]
# Load harness: sys.path bootstrap before lib.* imports
"scripts/load-test-telemetry-ingest.py" = ["E402", "I001"]
"scripts/load/locust/locustfile.py" = ["E402", "I001"]
"scripts/load/merge_partial_reports.py" = ["E402", "I001"]
"scripts/load/finalize_suite_report.py" = ["E402", "I001"]
"scripts/test_load_report.py" = ["E402", "I001"]
# Legacy compact Imagen helper — refactor separately
"scripts/generators/gemini_client.py" = ["E701", "E702", "E722"]
