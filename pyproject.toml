# Monorepo tooling — shared Ruff scope for all Python packages.
# Per-package overrides: backend/pyproject.toml (Django apps).

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stricter than backend/pyproject.toml ignore debt — used for telemetry + scripts CI.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
