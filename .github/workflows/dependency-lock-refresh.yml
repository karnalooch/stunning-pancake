name: Temporary dependency lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  refresh-lock:
    if: github.head_ref == 'chore/deps-latest-stable-2026-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: Regenerate lockfile strictly from manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen lockfile
        run: pnpm install --lockfile-only --frozen-lockfile

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "dependency metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push origin HEAD:${{ github.head_ref }}
