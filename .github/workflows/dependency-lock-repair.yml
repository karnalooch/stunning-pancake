name: Temporary dependency lock repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dependency-lock-repair-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  repair-lock:
    if: github.head_ref == 'chore/deps-latest-stable-2026-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - name: Repair lockfile strictly from manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen lockfile
        run: pnpm install --lockfile-only --frozen-lockfile

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(deps): repair pnpm lockfile specifiers"
          git push origin HEAD:${{ github.head_ref }}
