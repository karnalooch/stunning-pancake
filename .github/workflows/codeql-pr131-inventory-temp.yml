name: Temporary CodeQL PR131 inventory

concurrency:
  group: codeql-pr131-inventory-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [chore/versioning-ssot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: CodeQL inventory (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze without upload
        uses: github/codeql-action/analyze@v4
        with:
          category: "/pr131-inventory:${{ matrix.language }}"
          upload: never
          output: codeql-raw
          post-processed-sarif-path: codeql-sarif

      - name: Print findings
        shell: python
        run: |
          import json
          import pathlib
          from collections import Counter

          files = list(pathlib.Path("codeql-sarif").rglob("*.sarif"))
          rows = []
          meta = {}
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  for rule in run.get("tool", {}).get("driver", {}).get("rules", []):
                      rid = rule.get("id") or rule.get("name") or "<unknown>"
                      props = rule.get("properties", {})
                      meta[rid] = {
                          "name": rule.get("name", ""),
                          "security_severity": props.get("security-severity", ""),
                          "problem_severity": props.get("problem.severity", ""),
                      }
                  for result in run.get("results", []):
                      locs = result.get("locations", [])
                      loc = locs[0].get("physicalLocation", {}) if locs else {}
                      rows.append({
                          "rule": result.get("ruleId", "<unknown>"),
                          "level": result.get("level", ""),
                          "path": loc.get("artifactLocation", {}).get("uri", ""),
                          "line": loc.get("region", {}).get("startLine", ""),
                          "message": result.get("message", {}).get("text", "").replace("\n", " "),
                      })

          print("CODEQL_TOTAL", len(rows))
          print("CODEQL_RULE_SUMMARY_BEGIN")
          for rid, count in Counter(row["rule"] for row in rows).most_common():
              out = {"rule": rid, "count": count, **meta.get(rid, {})}
              print(json.dumps(out, ensure_ascii=False))
          print("CODEQL_RULE_SUMMARY_END")
          print("CODEQL_FINDINGS_BEGIN")
          for row in rows:
              print(json.dumps({**row, **meta.get(row["rule"], {})}, ensure_ascii=False))
          print("CODEQL_FINDINGS_END")
