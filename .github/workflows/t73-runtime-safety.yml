name: T73 runtime role and worker scope

on:
  pull_request:
    paths:
      - 'backend/core/db_role_guard.py'
      - 'backend/core/task_rls.py'
      - 'backend/core/celery.py'
      - 'backend/core/checks.py'
      - 'backend/core/wsgi.py'
      - 'backend/core/test_*t73.py'
      - 'backend/activities/signals.py'
      - 'backend/events/tasks.py'
      - 'backend/docker-entrypoint.sh'
      - 'docker-compose.home.yml'
      - '.env.home.example'
      - 'scripts/home_lab.py'
      - 'scripts/test_home_lab.py'
      - 'scripts/test_backend_entrypoint.py'
      - '.github/workflows/t73-runtime-safety.yml'
  push:
    branches: [main]
    paths:
      - 'backend/core/db_role_guard.py'
      - 'backend/core/task_rls.py'
      - 'backend/core/celery.py'
      - 'backend/core/checks.py'
      - 'backend/core/wsgi.py'
      - 'backend/core/test_*t73.py'
      - 'backend/activities/signals.py'
      - 'backend/events/tasks.py'
      - 'backend/docker-entrypoint.sh'
      - 'docker-compose.home.yml'
      - '.env.home.example'
      - 'scripts/home_lab.py'
      - 'scripts/test_home_lab.py'
      - 'scripts/test_backend_entrypoint.py'
      - '.github/workflows/t73-runtime-safety.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: fourvelo_ci
          POSTGRES_USER: fourvelo_ci
          POSTGRES_PASSWORD: fourvelo_ci_pass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
      REDIS_URL: redis://localhost:6379/15
      SECRET_KEY: t73-ci-insecure-key
      DEBUG: '1'
      DJANGO_SETTINGS_MODULE: core.settings
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install GIS dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - name: Install backend dependencies and Ruff
        run: |
          pip install -r backend/requirements.txt
          pip install "ruff>=0.8,<0.16"
      - name: Ruff T73 implementation
        working-directory: backend
        run: |
          ruff check \
            core/db_role_guard.py \
            core/task_rls.py \
            core/celery.py \
            core/checks.py \
            core/wsgi.py \
            core/test_db_role_guard_t73.py \
            core/test_task_rls_t73.py \
            core/test_checks_t73.py \
            core/test_celery_scope_t73.py \
            core/test_runtime_role_docs_t73.py \
            activities/signals.py \
            events/tasks.py
          ruff format --check \
            core/db_role_guard.py \
            core/task_rls.py \
            core/celery.py \
            core/checks.py \
            core/wsgi.py \
            core/test_db_role_guard_t73.py \
            core/test_task_rls_t73.py \
            core/test_checks_t73.py \
            core/test_celery_scope_t73.py \
            core/test_runtime_role_docs_t73.py \
            activities/signals.py \
            events/tasks.py
      - name: Focused T73 Django contract tests
        working-directory: backend
        run: |
          python manage.py test \
            core.test_db_role_guard_t73 \
            core.test_task_rls_t73 \
            core.test_checks_t73 \
            core.test_celery_scope_t73 \
            core.test_runtime_role_docs_t73 \
            --verbosity 2
      - name: Shell and home-lab control tests
        working-directory: scripts
        run: |
          python -m unittest test_backend_entrypoint.py test_home_lab.py
