name: T58 Pilot Release Evidence Gate

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: "Exact 40-character Git SHA to validate"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character Git SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: t58-pilot-release-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  pilot-release-evidence:
    name: T58 pilot release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Assert exact candidate checkout
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::candidate_sha must be exactly 40 hexadecimal characters"
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Exact candidate mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate baseline release artifacts
        run: python scripts/release/pre_release_check.py

      - name: Enforce T58 pilot evidence
        run: >-
          python scripts/release/pre_release_check.py --pilot
          --report "$RUNNER_TEMP/t58-pilot-release.json"

      - name: Upload T58 evidence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t58-pilot-release-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/t58-pilot-release.json
          if-no-files-found: error
          retention-days: 14
