name: T70 Ruff format diagnostic

on:
  push:

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Show formatter diff
        run: |
          pip install "ruff==0.15.22"
          cd backend
          ruff format --diff users/models.py || true
