name: 4VELO CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    - cron: '0 2 * * *'

# Default read-only; jobs that upload SARIF override security-events (and actions).
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      mobile: ${{ steps.filter.outputs.mobile }}
      admin: ${{ steps.filter.outputs.admin }}
      packages: ${{ steps.filter.outputs.packages }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}
      full: ${{ steps.full.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            telemetry:
              - 'telemetry/**'
            mobile:
              - 'mobile/**'
            admin:
              - 'admin/**'
            packages:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            scripts:
              - 'scripts/**'
              - 'pyproject.toml'
            docs:
              - 'docs/**'
            workflow:
              - '.github/workflows/**'
      - id: full
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────
  # Backend: Lint + Type Check + Tests
  # ──────────────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: sport_test
          POSTGRES_USER: sport_user
          POSTGRES_PASSWORD: sport_pass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GDAL/GEOS (PostGIS deps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          pip install "ruff>=0.8,<0.16"
          cd backend
          ruff check . --output-format=github
          ruff format --check .

      - name: Type check with mypy (guarded modules)
        run: |
          pip install mypy django-stubs
          cd backend
          mypy --config-file mypy-ci.ini \
            core/load_guard.py \
            core/fake_redis.py \
            activities/services.py \
            activities/telemetry_shard.py \
            activities/simulator_routing_backpressure.py

      - name: Run Django system checks
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
          DJANGO_SETTINGS_MODULE: core.settings
        run: |
          cd backend
          python manage.py check

      - name: Run migrations
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python manage.py migrate

      - name: Simulator light tests (pytest)
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          pip install pytest pytest-django
          python run_pytest.py activities/test_simulator_backpressure.py activities/test_simulator_status_views.py activities/test_simulator_routing.py activities/test_simulator_operational_gate.py -m simulator_light -v

      - name: P1 admin pytest (anomaly queue, sponsor pools)
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python run_pytest.py activities/test_anomaly_queue.py activities/test_sim_lab_proxy.py activities/test_gpx_export.py activities/test_gpx_forensics.py activities/test_gpx_storage.py rewards/test_pools.py users/test_export.py users/test_jwt_mfa.py test_openapi_schema.py -q

      - name: Backend coverage gate (phased P2, 40% on guarded modules)
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          pip install pytest-cov
          python run_pytest.py \
            --cov=core.load_guard \
            --cov=activities.gpx_export --cov=activities.telemetry_shard \
            --cov=activities.simulator_routing_backpressure \
            --cov-report=term-missing --cov-fail-under=40 -q \
            activities/test_gpx_export.py \
            activities/test_simulator_backpressure.py activities/test_simulator_status_views.py \
            activities/test_simulator_operational_gate.py \
            -m simulator_light -q

      # The legacy all-app suite still contains stale fixtures and mocks tracked as
      # takeover debt. Keep it visible while focused backend gates above remain blocking.
      - name: Full legacy suite (non-blocking baseline)
        continue-on-error: true
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python manage.py test --verbosity=2

  # ──────────────────────────────────────────
  # Telemetry service: ingest guard + queue tests (ADR 011)
  # ──────────────────────────────────────────
  telemetry:
    name: Telemetry (FastAPI)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.telemetry == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install telemetry dependencies
        run: |
          pip install "ruff>=0.8,<0.16"
          pip install -r telemetry/requirements.txt -r telemetry/requirements-dev.txt

      - name: Ruff (telemetry)
        run: |
          ruff check telemetry --output-format=github
          ruff format --check telemetry

      - name: Run telemetry unit tests
        env:
          DATABASE_URL: postgresql://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
        run: cd telemetry && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin

  # ──────────────────────────────────────────
  # Mobile app (Jest)
  # ──────────────────────────────────────────
  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.packages == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint with Expo ESLint
        run: pnpm --filter mobile lint

      - name: TypeScript type check
        run: pnpm --filter mobile typecheck

      - name: Design token guard (no inline hex in screens)
        run: pnpm audit:screen-tokens

      - name: Run unit tests
        run: pnpm --filter mobile test -- --ci --forceExit --passWithNoTests

  # ──────────────────────────────────────────
  # Repo scripts (Python) + design tokens
  # ──────────────────────────────────────────
  scripts-python:
    name: Scripts (Python)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff (scripts/)
        run: |
          pip install "ruff>=0.8,<0.16"
          ruff check scripts --config pyproject.toml --output-format=github

      - name: OpenAPI docs drift (critical paths)
        run: python scripts/check_openapi_drift.py

      - name: Test check_docs_links parser
        run: |
          pip install pytest
          python -m pytest scripts/test_check_docs_links.py -q

      - name: Test load report helpers
        run: python -m pytest scripts/test_load_report.py -q

  repo-assets:
    name: Shared tokens
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.packages == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify design tokens build
        run: pnpm tokens:check

      - name: Verify API client OpenAPI paths
        run: pnpm api:codegen:check

  docs-links:
    name: Documentation links
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.docs == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check relative links in docs/
        run: python scripts/check_docs_links.py

  # ──────────────────────────────────────────
  # Admin Dashboard: Lint + Type Check + Build
  # ──────────────────────────────────────────
  admin:
    name: Admin Dashboard (React/TypeScript)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.packages == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ESLint
        run: pnpm --filter admin lint

      - name: Vitest unit tests
        run: pnpm --filter admin test -- --run

      - name: TypeScript type check
        run: pnpm --filter admin typecheck

      - name: Build production bundle
        run: pnpm --filter admin build

  # ──────────────────────────────────────────
  # Audit: Route parity, dead screens, RBAC consistency, env drift
  # ──────────────────────────────────────────
  audit:
    name: Audit (Routes + Screens + RBAC + Env)
    runs-on: ubuntu-latest
    needs: [changes, admin]
    if: |
      always() && needs.admin.result == 'success' && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.admin == 'true' ||
        needs.changes.outputs.scripts == 'true'
      )

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Route Parity Check
        run: pnpm audit:routes

      - name: Dead Screen Detection
        run: pnpm audit:screens

      - name: Mobile Screen Parity
        run: pnpm audit:mobile

      - name: API Gap Analysis
        run: pnpm audit:api

      - name: RBAC Consistency Audit
        run: pnpm audit:rbac

      - name: Redirect Chain Audit
        run: pnpm audit:redirects

      - name: Environment Variable Drift
        run: pnpm audit:env

      - name: Dead Import Detection
        run: pnpm audit:imports

  # ──────────────────────────────────────────
  # Security: Dependency vulnerability scan
  # ──────────────────────────────────────────
  security:
    name: Security Scan (pip-audit + npm audit)
    runs-on: ubuntu-latest
    needs: [changes, backend, admin]
    if: |
      always() && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.admin == 'true' ||
        needs.changes.outputs.mobile == 'true'
      ) && (
        needs.backend.result == 'success' || needs.backend.result == 'skipped'
      ) && (
        needs.admin.result == 'success' || needs.admin.result == 'skipped'
      )

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-60 || true

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Node dependencies (pnpm audit)
        run: |
          pnpm --filter admin audit --audit-level=high || true
          pnpm --filter mobile audit --audit-level=high || true

      - name: License compliance check (OSS inventory)
        run: |
          pip install -r backend/requirements.txt
          pip install pip-licenses
          node scripts/compliance/generate-third-party-notices.mjs --check

  # ──────────────────────────────────────────
  # Trivy: Container & Filesystem CVE Scan (Milestone 3)
  # Results appear in GitHub Security → Code Scanning tab
  # ──────────────────────────────────────────
  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v6

      # Run all filesystem scans before SARIF upload so a failed upload cannot skip later scans.
      - name: Trivy — Backend (Python)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: backend/
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — Admin Dashboard (JS/TS)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: admin/
          format: sarif
          output: trivy-admin.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy — Mobile (React Native)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: mobile/
          format: sarif
          output: trivy-mobile.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload backend SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-backend.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload admin SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-admin.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          sarif_file: trivy-admin.sarif
          category: trivy-admin

      - name: Upload mobile SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-mobile.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          sarif_file: trivy-mobile.sarif
          category: trivy-mobile

  # ──────────────────────────────────────────
  # E2E: Playwright tests on built admin
  # ──────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, admin]
    if: |
      always() && needs.admin.result == 'success' && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.admin == 'true'
      )

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter admin exec playwright install --with-deps chromium

      - name: Build admin for preview (VITE_E2E=1 — Live Map bridge)
        run: VITE_E2E=1 pnpm --filter admin build

      - name: Run E2E with managed preview server
        run: |
          cd admin
          pnpm exec playwright test --project=chromium --project="Mobile Chrome" --reporter=github --global-timeout=900000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Live Map LOD + WebGL audit gate
        run: |
          cd admin
          pnpm exec playwright test --project=live-map-zoom --reporter=github --global-timeout=900000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7
