name: 4VELO CI/CD Pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request: {}
  schedule:
    - cron: '0 2 * * *'

# Default read-only; jobs that upload SARIF override security-events (and actions).
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24.21.0'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      mobile: ${{ steps.classifier.outputs.lane_mobile_runtime }}
      admin: ${{ steps.filter.outputs.admin }}
      packages: ${{ steps.filter.outputs.packages }}
      scripts: ${{ steps.filter.outputs.scripts }}
      docs: ${{ steps.classifier.outputs.lane_docs_policy }}
      visual: ${{ steps.classifier.outputs.visual_contract_required }}
      mobile_assets: ${{ steps.classifier.outputs.lane_mobile_assets }}
      mobile_asset_only: ${{ steps.classifier.outputs.lane_mobile_asset_only }}
      mobile_native: ${{ steps.classifier.outputs.lane_mobile_native }}
      lane_python: ${{ steps.classifier.outputs.lane_python }}
      lane_javascript: ${{ steps.classifier.outputs.lane_javascript }}
      lane_docs_policy: ${{ steps.classifier.outputs.lane_docs_policy }}
      lane_infra: ${{ steps.classifier.outputs.lane_infra }}
      full_release: ${{ steps.classifier.outputs.lane_full_release }}
      ci_core: ${{ steps.filter.outputs.ci_core }}
      workflow: ${{ steps.filter.outputs.workflow }}
      full: ${{ steps.full.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            telemetry:
              - 'telemetry/**'
            mobile:
              - 'mobile/src/**'
              - 'mobile/__tests__/**'
              - 'mobile/.maestro/**'
              - 'mobile/locales/**'
              - 'mobile/*.js'
              - 'mobile/*.ts'
              - 'mobile/*.tsx'
              - 'mobile/*.json'
            admin:
              - 'admin/**'
            packages:
              - 'packages/**'
              - '.github/actions/pnpm-setup/**'
              - '.npmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            scripts:
              - 'scripts/**'
              - '**/*railway.json'
              - 'pyproject.toml'
              - 'docker-compose.prod.yml'
              - 'version.json'
              - 'app.json'
              - 'package.json'
              - 'mobile/package.json'
              - 'mobile/app.config.js'
              - 'mobile/eas.json'
              - 'admin/package.json'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'AGENTS.md'
              - 'scripts/check_docs_links.py'
              - 'scripts/check_docs_i18n.py'
            visual:
              - 'mobile/assets/**'
              - 'mobile/src/assets/**'
              - 'mobile/src/screens/**'
              - 'mobile/src/components/**'
              - 'mobile/src/theme/**'
              - 'mobile/src/design-contract/**'
              - 'assets/**'
              - 'docs/design/**'
              - 'docs/adr/**'
              - 'docs/pl/design/**'
              - 'docs/pl/adr/**'
              - 'docs/TAKEOVER_PLAN_CURRENT.md'
              - 'packages/tokens/**'
              - 'scripts/audit-screen-tokens.ts'
              - 'scripts/validate_mobile_asset_governance.py'
              - 'scripts/test_validate_mobile_asset_governance.py'
              - 'scripts/validate_mobile_visual_authority.py'
              - 'scripts/test_validate_mobile_visual_authority.py'
              - 'scripts/test_ci_visual_path_filter.py'
              - 'scripts/check_ci_aggregate.py'
              - 'scripts/test_ci_aggregate.py'
              - '.github/workflows/**'
            ci_core:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/plan_affected_tests.py'
              - 'scripts/run_affected_mobile_tests.py'
              - 'scripts/run_affected_backend_tests.py'
              - 'scripts/test_plan_affected_tests.py'
              - 'scripts/test_run_affected_mobile_tests.py'
              - 'scripts/test_run_affected_backend_tests.py'
              - 'scripts/check_ci_aggregate.py'
              - 'scripts/test_ci_aggregate.py'
              - 'scripts/test_ci_mobile_path_filter.py'
              - 'scripts/test_ci_visual_path_filter.py'
              - 'scripts/test_ci_change_classifier.py'
              - 'turbo.json'
            workflow:
              - '.github/workflows/**'
      - name: Classify CI lanes
        id: classifier
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/plan_affected_tests.py \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - id: full
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.workflow }}" = "true" ] || [ "${{ steps.filter.outputs.ci_core }}" = "true" ] || [ "${{ steps.classifier.outputs.full_fallback }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────
  # T94: deterministic affected-test plan
  # ──────────────────────────────────────────
  affected-test-plan:
    name: Affected Test Plan
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test affected-test planner and runners
        run: |
          python -m unittest scripts/test_plan_affected_tests.py -v
          python -m unittest scripts/test_run_affected_mobile_tests.py -v
          python -m unittest scripts/test_run_affected_backend_tests.py -v

      - name: Test Node and pnpm toolchain contract
        run: python -m unittest scripts/test_toolchain_versions.py -v

      - name: Build human-readable affected-test plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .ci
          python scripts/plan_affected_tests.py \
            --output .ci/affected-plan.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --summary

  # ──────────────────────────────────────────
  # Backend: Lint + Type Check + Tests
  # ──────────────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    needs: [changes, affected-test-plan]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: fourvelo_ci
          POSTGRES_USER: fourvelo_ci
          POSTGRES_PASSWORD: fourvelo_ci_pass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Plan affected backend tests
        id: affected
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .ci
          python scripts/plan_affected_tests.py \
            --output .ci/affected-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary

      - name: Install GDAL/GEOS (PostGIS deps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          pip install "ruff>=0.8,<0.16"
          cd backend
          ruff check . --output-format=github
          ruff format --check .

      - name: Type check with mypy (guarded modules)
        run: |
          pip install mypy django-stubs
          cd backend
          mypy --config-file mypy-ci.ini \
            core/load_guard.py \
            core/fake_redis.py \
            activities/services.py \
            activities/telemetry_shard.py \
            activities/simulator_routing_backpressure.py

      - name: Run Django system checks
        env:
          DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
          DJANGO_SETTINGS_MODULE: core.settings
        run: |
          cd backend
          python manage.py check

      - name: Run migrations
        env:
          DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python manage.py migrate

      - name: Run affected backend tests
        env:
          DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-insecure-key
        run: |
          pip install pytest pytest-django
          python scripts/run_affected_backend_tests.py --plan .ci/affected-plan.json

      - name: Backend coverage gate (phased P2, 40% on guarded modules)
        env:
          DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
          REDIS_URL: redis://localhost:6379/15
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          pip install pytest-cov
          python run_pytest.py \
            --cov=core.load_guard \
            --cov=activities.gpx_export --cov=activities.telemetry_shard \
            --cov=activities.simulator_routing_backpressure \
            --cov-report=term-missing --cov-fail-under=40 -q \
            activities/test_gpx_export.py \
            activities/test_simulator_backpressure.py activities/test_simulator_status_views.py \
            activities/test_simulator_operational_gate.py \
            -m simulator_light -q

      # The legacy all-app suite is green and blocks full backend CI runs.
      - name: Full legacy suite
        if: steps.affected.outputs.backend_mode == 'full'
        env:
          DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python manage.py test --verbosity=2

  # ──────────────────────────────────────────
  # Telemetry service: ingest guard + queue tests (ADR 011)
  # ──────────────────────────────────────────
  telemetry:
    name: Telemetry (FastAPI)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.telemetry == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install telemetry dependencies
        run: |
          pip install "ruff>=0.8,<0.16"
          pip install -r telemetry/requirements.txt -r telemetry/requirements-dev.txt

      - name: Ruff (telemetry)
        run: |
          ruff check telemetry --output-format=github
          ruff format --check telemetry

      - name: Run telemetry unit tests
        env:
          DATABASE_URL: postgresql://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
        run: cd telemetry && PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin

  # ──────────────────────────────────────────
  # Mobile app (Jest)
  # ──────────────────────────────────────────
  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    needs: [changes, affected-test-plan]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.packages == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Plan affected mobile tests
        id: affected
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .ci
          python scripts/plan_affected_tests.py \
            --output .ci/affected-plan.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Mobile test-runner integrity contract
        run: python -m unittest scripts/test_ci_mobile_path_filter.py -v

      - name: Test pnpm workspace selector integrity
        run: python -m unittest scripts/test_ci_workspace_selectors.py -v

      - name: Mobile platform configuration contract
        run: python -m unittest scripts/test_mobile_platform_contract.py -v

      - name: Mobile runtime/appVersion boundary
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/validate_mobile_runtime_boundary.py \
            --base-sha "$CI_BASE_SHA" \
            --head-sha "$CI_HEAD_SHA"

      - name: MMKV v4 migration contract
        run: python -m unittest scripts/test_mobile_mmkv_v4_contract.py -v

      - name: Expo dependency compatibility
        id: expo_deps
        continue-on-error: true
        working-directory: mobile
        run: pnpm exec expo install --check

      - name: Expo Doctor
        id: expo_doctor
        continue-on-error: true
        working-directory: mobile
        run: pnpm dlx expo-doctor@1.20.4 .

      - name: Lint with Expo ESLint
        run: pnpm --dir mobile lint

      - name: TypeScript type check
        run: pnpm --dir mobile typecheck

      - name: Metro bundle smoke (Android)
        working-directory: mobile
        env:
          EXPO_PUBLIC_ENABLE_FIREBASE: 'false'
        run: pnpm exec expo export --platform android --output-dir ../.ci/mobile-bundle-smoke

      - name: Design token guard (no inline hex in screens)
        run: pnpm audit:screen-tokens

      - name: Run affected mobile unit tests
        run: python scripts/run_affected_mobile_tests.py --plan .ci/affected-plan.json

      - name: Preview canonical Expo dependency remediation
        if: steps.expo_deps.outcome != 'success'
        continue-on-error: true
        run: |
          # The repo-wide React override currently forces the admin's React patch
          # into mobile as well. Preview the real Expo-compatible graph without
          # mutating the committed tree or allowing this diagnostic to affect
          # the baseline lint/typecheck/tests above.
          python - <<'PY'
          from pathlib import Path
          path = Path("pnpm-workspace.yaml")
          text = path.read_text(encoding="utf-8")
          text = text.replace("  react: 19.2.7\n", "")
          text = text.replace("  react-dom: 19.2.7\n", "")
          path.write_text(text, encoding="utf-8")
          PY
          # This is an ephemeral diagnostic workspace. The committed baseline
          # stays frozen above; here we deliberately regenerate the lock after
          # changing the override set, then let Expo write its SDK-compatible
          # package versions so the exact remediation diff is observable.
          pnpm install --no-frozen-lockfile
          CI=false pnpm --dir mobile exec expo install --fix
          echo "::group::Expo remediation diff"
          git diff -- mobile/package.json pnpm-lock.yaml pnpm-workspace.yaml
          echo "::endgroup::"

      - name: Expo compatibility gate
        if: always() && (steps.expo_deps.outcome != 'success' || steps.expo_doctor.outcome != 'success')
        run: |
          echo "Expo dependency check: ${{ steps.expo_deps.outcome }}"
          echo "Expo Doctor: ${{ steps.expo_doctor.outcome }}"
          exit 1

  # ──────────────────────────────────────────
  # Repo scripts (Python) + design tokens
  # ──────────────────────────────────────────
  scripts-python:
    name: Scripts (Python)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff (scripts/)
        run: |
          pip install "ruff>=0.8,<0.16"
          ruff check scripts --config pyproject.toml --output-format=github

      - name: Test backend entrypoint dispatch
        run: python -m unittest test_backend_entrypoint -v
        working-directory: scripts

      - name: Validate tracked Railway signing-key configuration
        run: |
          python -m unittest test_check_config_secrets -v
          python check_config_secrets.py
        working-directory: scripts

      - name: OpenAPI docs drift (critical paths)
        run: python scripts/check_openapi_drift.py

      - name: Test check_docs_links parser
        run: |
          pip install pytest
          python -m pytest scripts/test_check_docs_links.py -q

      - name: Test load report helpers
        run: python -m pytest scripts/test_load_report.py -q

      - name: Test CI mobile path routing
        run: python -m unittest scripts/test_ci_mobile_path_filter.py

      - name: Test lane-based change classifier wiring
        run: python -m unittest scripts/test_ci_change_classifier.py -v

      - name: Test mobile Android harness contract
        run: python -m unittest scripts/test_mobile_harness_contract.py -v

      - name: Test cost-aware Mobile Native Smoke routing
        run: python -m unittest scripts/test_mobile_native_smoke_workflow.py -v

      - name: Test mobile runtime/appVersion boundary
        run: python -m unittest scripts/test_mobile_runtime_boundary.py -v

      - name: Test CI aggregate policy
        run: python -m unittest scripts/test_ci_aggregate.py -v

      - name: Test Trivy CI security contract
        run: python -m unittest scripts/test_trivy_ci_contract.py -v

      - name: Test security tooling workflows contract
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r /dev/stdin <<'PIPREQS'
          PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc
          PIPREQS
          python -m unittest scripts/test_security_tooling_workflows.py -v

      - name: Test CI workflow contract
        run: python -m unittest scripts/test_ci_pr_base_coverage.py -v

      - name: Test PR workflow concurrency policy
        run: python -m unittest scripts/test_ci_pr_concurrency.py -v

      - name: Test GitHub Project status automation
        run: |
          python -m unittest scripts/test_project_status_automation.py -v
          python -m unittest scripts/test_project_status_workflow.py -v

      - name: Test fail-closed auto-merge policy
        run: |
          python -m unittest scripts/test_auto_merge.py -v
          python -m unittest scripts/test_auto_merge_workflow.py -v

      - name: Validate product version contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/versioning.py check --tag "${GITHUB_REF#refs/tags/}"
          else
            python scripts/versioning.py check
          fi
          python -m unittest scripts/test_versioning.py -v

      - name: Test T94 affected-test planning
        run: |
          python -m unittest scripts/test_plan_affected_tests.py -v
          python -m unittest scripts/test_run_affected_mobile_tests.py -v
          python -m unittest scripts/test_run_affected_backend_tests.py -v

      - name: Validate production Compose contract
        env:
          DB_PASSWORD: ci-only-compose-password
          SECRET_KEY: ci-only-compose-secret-key
        run: |
          python -m unittest scripts/test_production_compose_contract.py -v
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate mobile asset governance
        run: python scripts/validate_mobile_asset_governance.py

      - name: Test mobile asset governance validator
        run: python -m unittest scripts/test_validate_mobile_asset_governance.py -v

      - name: Validate takeover-era mobile visual authority
        run: python scripts/validate_mobile_visual_authority.py

      - name: Test mobile visual authority validator
        run: python -m unittest scripts/test_validate_mobile_visual_authority.py -v

  # ──────────────────────────────────────────
  # Mobile Visual Contract — takeover-era UI/asset protection
  # ──────────────────────────────────────────
  mobile-visual-contract:
    name: Mobile Visual Contract
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.visual == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Visual path-routing contract
        run: python -m unittest scripts/test_ci_visual_path_filter.py -v

      - name: Frozen UI semantic product guard
        run: pnpm audit:screen-tokens

      - name: Validate asset governance
        run: python scripts/validate_mobile_asset_governance.py

      - name: Test asset governance validator
        run: python -m unittest scripts/test_validate_mobile_asset_governance.py -v

      - name: Validate visual authority
        run: python scripts/validate_mobile_visual_authority.py

      - name: Test visual authority validator
        run: python -m unittest scripts/test_validate_mobile_visual_authority.py -v

      - name: Asset-only governance test
        if: needs.changes.outputs.mobile_asset_only == 'true'
        run: |
          pnpm --dir mobile test --ci --forceExit --runTestsByPath \
            __tests__/assets/assetGovernance.test.ts

      - name: Mobile visual contract TypeScript check
        if: needs.changes.outputs.mobile_asset_only != 'true'
        run: pnpm --dir mobile typecheck

      - name: Mobile visual foundation tests
        if: needs.changes.outputs.mobile_asset_only != 'true'
        run: |
          pnpm --dir mobile test --ci --forceExit --runTestsByPath \
            __tests__/assets/assetGovernance.test.ts \
            __tests__/theme/semantic.test.ts

  repo-assets:
    name: Shared tokens
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.packages == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify design tokens build
        run: pnpm tokens:check

      - name: Verify API client OpenAPI paths
        run: pnpm api:codegen:check

  docs-links:
    name: Documentation links
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.docs == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check relative links in docs/
        run: python scripts/check_docs_links.py

      - name: Check EN/PL paired docs
        run: python scripts/check_docs_i18n.py

  # ──────────────────────────────────────────
  # Admin Dashboard: Lint + Type Check + Build
  # ──────────────────────────────────────────
  admin:
    name: Admin Dashboard (React/TypeScript)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.packages == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ESLint
        run: pnpm --filter admin lint

      - name: Vitest unit tests
        run: pnpm --filter admin test -- --run

      - name: TypeScript type check
        run: pnpm --filter admin typecheck

      - name: Build production bundle
        run: pnpm --filter admin build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Validate Admin Docker build (no push, blocks PR on context repair)
        # Build from the monorepo root and persist BuildKit layers independently
        # of the post-gate publishing cache. No registry login and no push.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: admin/Dockerfile
          push: false
          cache-from: type=gha,scope=admin-pr-validation
          cache-to: type=gha,mode=max,scope=admin-pr-validation

  # ──────────────────────────────────────────
  # Audit: Route parity, dead screens, RBAC consistency, env drift
  # ──────────────────────────────────────────
  audit:
    name: Audit (Routes + Screens + RBAC + Env)
    runs-on: ubuntu-latest
    needs: [changes, admin]
    if: |
      always() && (needs.admin.result == 'success' || needs.admin.result == 'skipped') && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.admin == 'true' ||
        needs.changes.outputs.scripts == 'true'
      )

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Route Parity Check
        run: pnpm audit:routes

      - name: Dead Screen Detection
        run: pnpm audit:screens

      - name: Mobile Screen Parity
        run: pnpm audit:mobile

      - name: API Gap Analysis
        run: pnpm audit:api

      - name: RBAC Consistency Audit
        run: pnpm audit:rbac

      - name: Redirect Chain Audit
        run: pnpm audit:redirects

      - name: Environment Variable Drift
        run: pnpm audit:env

      - name: Dead Import Detection
        run: pnpm audit:imports

  # ──────────────────────────────────────────
  # Security: Dependency vulnerability scan
  # ──────────────────────────────────────────
  security:
    name: Security inventory (non-blocking)
    runs-on: ubuntu-latest
    needs: [changes, backend, admin]
    if: |
      always() && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.admin == 'true' ||
        needs.changes.outputs.mobile == 'true'
      ) && (
        needs.backend.result == 'success' || needs.backend.result == 'skipped'
      ) && (
        needs.admin.result == 'success' || needs.admin.result == 'skipped'
      )

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-60

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit Node workspace dependencies (pnpm audit)
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: License compliance check (OSS inventory)
        run: |
          pip install -r backend/requirements.txt
          pip install pip-licenses
          node scripts/compliance/generate-third-party-notices.mjs --check

  # ──────────────────────────────────────────
  # Trivy: Container & Filesystem CVE Scan (Milestone 3)
  # Results appear in GitHub Security → Code Scanning tab
  # ──────────────────────────────────────────
  # ──────────────────────────────────────────
  # SAST: CodeQL for first-party Python + JavaScript/TypeScript code.
  # Findings are uploaded to GitHub Code Scanning; execution failures block
  # the aggregate gate.
  # ──────────────────────────────────────────
  codeql-python:
    name: CodeQL Python
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.lane_python == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL Python
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - name: Analyze Python with CodeQL
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:python

  codeql-javascript:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.lane_javascript == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize CodeQL JavaScript/TypeScript
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze JavaScript/TypeScript with CodeQL
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:javascript-typescript

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: [changes, codeql-python, codeql-javascript]
    if: |
      always() && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.lane_python == 'true' ||
        needs.changes.outputs.lane_javascript == 'true'
      )
    steps:
      - name: Enforce language-specific CodeQL lanes
        env:
          FULL: ${{ needs.changes.outputs.full }}
          PYTHON_EXPECTED: ${{ needs.changes.outputs.lane_python }}
          JAVASCRIPT_EXPECTED: ${{ needs.changes.outputs.lane_javascript }}
          PYTHON_RESULT: ${{ needs['codeql-python'].result }}
          JAVASCRIPT_RESULT: ${{ needs['codeql-javascript'].result }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            PYTHON_EXPECTED=true
            JAVASCRIPT_EXPECTED=true
          fi
          check_lane() {
            expected="$1"
            result="$2"
            label="$3"
            if [ "$expected" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "$label expected success, got $result" >&2
                exit 1
              fi
            elif [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "$label unexpected result: $result" >&2
              exit 1
            fi
          }
          check_lane "$PYTHON_EXPECTED" "$PYTHON_RESULT" "CodeQL Python"
          check_lane "$JAVASCRIPT_EXPECTED" "$JAVASCRIPT_RESULT" "CodeQL JavaScript/TypeScript"
  # ──────────────────────────────────────────
  # Dependency Review: block PRs that introduce HIGH/CRITICAL vulnerable
  # dependencies. Dependabot remains the post-merge monitor.
  # ──────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Generate uploadable SARIF first. Keep these scans non-blocking so results
      # reach GitHub Security before the dedicated gate evaluates the same repo.
      - name: Trivy — Backend (Python)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: backend/
          scanners: vuln
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Trivy — Admin Dashboard (JS/TS)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: admin/
          scanners: vuln
          format: sarif
          output: trivy-admin.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Trivy — Mobile (React Native)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: mobile/
          scanners: vuln
          format: sarif
          output: trivy-mobile.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload backend SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: hashFiles('trivy-backend.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload admin SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: hashFiles('trivy-admin.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          sarif_file: trivy-admin.sarif
          category: trivy-admin

      - name: Upload mobile SARIF → GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        if: hashFiles('trivy-mobile.sarif') != ''
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          sarif_file: trivy-mobile.sarif
          category: trivy-mobile

      # This final scan is the enforcement point. A HIGH/CRITICAL vulnerability
      # fails the Trivy job (and therefore the aggregate merge gate) only after
      # the SARIF uploads above have had a chance to publish their findings.
      - name: Trivy — Blocking Critical/High gate
        # v0.35.0 — same reviewed/pinned action as the reporting scans above.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ──────────────────────────────────────────
  # E2E: Playwright tests on built admin
  # ──────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, admin]
    if: |
      always() && needs.admin.result == 'success' && (
        needs.changes.outputs.full == 'true' ||
        needs.changes.outputs.admin == 'true'
      )

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright browsers
        run: pnpm --filter admin exec playwright install --with-deps chromium

      - name: Build admin for preview (VITE_E2E=1 — Live Map bridge)
        run: VITE_E2E=1 pnpm --filter admin build

      - name: Run E2E with managed preview server
        run: |
          cd admin
          pnpm exec playwright test --project=chromium --project="Mobile Chrome" --reporter=github --global-timeout=900000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Live Map LOD + WebGL audit gate
        run: |
          cd admin
          pnpm exec playwright test --project=live-map-zoom --reporter=github --global-timeout=900000
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────
  # Aggregate gate: single required CI signal (T22)
  # ──────────────────────────────────────────
  aggregate:
    name: Aggregate CI gate
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 15
    needs: [changes, affected-test-plan, backend, telemetry, mobile, mobile-visual-contract, scripts-python, repo-assets, docs-links, admin, audit, security, codeql, dependency-review, trivy, e2e]
    env:
      CI_NEEDS_JSON: ${{ toJson(needs) }}
      CI_EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Evaluate required-job matrix
        run: python scripts/check_ci_aggregate.py

  # ──────────────────────────────────────────
  # T24: prepare-publish — validate ref/SHA before any publish job runs.
  # Runs only on `push` events. Does no checkout, has no permissions.
  # Outputs are consumed by `publish-containers` and the reusable
  # `.github/workflows/docker-publish.yml` workflow.
  # ──────────────────────────────────────────
  prepare-publish: # pre-publish ref/sha validation
    name: Prepare publish inputs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions: {}
    outputs:
      allowed: ${{ steps.validate.outputs.allowed }}
      publish_kind: ${{ steps.validate.outputs.publish_kind }}
      validated_sha: ${{ steps.validate.outputs.validated_sha }}
      validated_ref: ${{ steps.validate.outputs.validated_ref }}
      version: ${{ steps.validate.outputs.version }}
      major_minor: ${{ steps.validate.outputs.major_minor }}
    steps:
      - name: Validate SHA, ref, and version
        id: validate
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          REF="${GITHUB_REF}"

          # SHA must be exactly 40 hex chars
          if [[ ! "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "allowed=false"        >> "$GITHUB_OUTPUT"
            echo "publish_kind="        >> "$GITHUB_OUTPUT"
            echo "validated_sha="       >> "$GITHUB_OUTPUT"
            echo "validated_ref="       >> "$GITHUB_OUTPUT"
            echo "version="             >> "$GITHUB_OUTPUT"
            echo "major_minor="         >> "$GITHUB_OUTPUT"
            echo "prepare-publish: invalid SHA=${SHA}" >&2
            exit 0
          fi

          case "${REF}" in
            refs/heads/main|refs/heads/master)
              echo "allowed=true"        >> "$GITHUB_OUTPUT"
              echo "publish_kind=branch" >> "$GITHUB_OUTPUT"
              echo "validated_sha=${SHA}"      >> "$GITHUB_OUTPUT"
              echo "validated_ref=${REF}"      >> "$GITHUB_OUTPUT"
              echo "version="                  >> "$GITHUB_OUTPUT"
              echo "major_minor="              >> "$GITHUB_OUTPUT"
              ;;
            refs/tags/v*)
              # strict semver tag
              if [[ "${REF}" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                echo "allowed=true"                    >> "$GITHUB_OUTPUT"
                echo "publish_kind=tag"                >> "$GITHUB_OUTPUT"
                echo "validated_sha=${SHA}"            >> "$GITHUB_OUTPUT"
                echo "validated_ref=${REF}"            >> "$GITHUB_OUTPUT"
                echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
                echo "major_minor=${MAJOR}.${MINOR}"  >> "$GITHUB_OUTPUT"
              else
                echo "allowed=false"        >> "$GITHUB_OUTPUT"
                echo "publish_kind="        >> "$GITHUB_OUTPUT"
                echo "validated_sha="       >> "$GITHUB_OUTPUT"
                echo "validated_ref="       >> "$GITHUB_OUTPUT"
                echo "version="             >> "$GITHUB_OUTPUT"
                echo "major_minor="         >> "$GITHUB_OUTPUT"
                echo "prepare-publish: tag does not match strict vX.Y.Z pattern: ${REF}" >&2
              fi
              ;;
            *)
              # Unsupported ref (e.g. branch protection refs, non-publishable refs).
              # Report allowed=false so publish-containers is skipped; the overall
              # CI workflow still passes.
              echo "allowed=false"        >> "$GITHUB_OUTPUT"
              echo "publish_kind="        >> "$GITHUB_OUTPUT"
              echo "validated_sha="       >> "$GITHUB_OUTPUT"
              echo "validated_ref="       >> "$GITHUB_OUTPUT"
              echo "version="             >> "$GITHUB_OUTPUT"
              echo "major_minor="         >> "$GITHUB_OUTPUT"
              echo "prepare-publish: unsupported ref ${REF}" >&2
              ;;
          esac

  # ──────────────────────────────────────────
  # T24: publish-containers — caller of the reusable docker-publish workflow.
  # Runs only when prepare-publish marked the push as allowed. Passes the
  # pre-validated outputs to docker-publish.yml; never recomputes them.
  # ──────────────────────────────────────────
  publish-containers: # post-gate publish caller (job-level reusable workflow call)
    name: Publish containers (gated by Aggregate CI gate)
    needs: [aggregate, prepare-publish]
    if: needs.prepare-publish.outputs.allowed == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      validated_sha: ${{ needs.prepare-publish.outputs.validated_sha }}
      validated_ref: ${{ needs.prepare-publish.outputs.validated_ref }}
      publish_kind: ${{ needs.prepare-publish.outputs.publish_kind }}
      version: ${{ needs.prepare-publish.outputs.version }}
      major_minor: ${{ needs.prepare-publish.outputs.major_minor }}


  # ──────────────────────────────────────────
  # SLSA provenance for the immutable backend/admin image digests produced by
  # the gated publish workflow. The upstream generator requires an exact
  # semantic version reference rather than a commit SHA.
  # ──────────────────────────────────────────
  slsa-provenance:
    name: SLSA Provenance
    needs: [publish-containers]
    if: needs.publish-containers.result == 'success'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.publish-containers.outputs.slsa_subjects }}
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/v') }}
