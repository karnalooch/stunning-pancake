name: SPORT CI/CD Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────
  # Backend: Lint + Type Check + Tests
  # ──────────────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: sport_test
          POSTGRES_USER: sport_user
          POSTGRES_PASSWORD: sport_pass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install GDAL/GEOS (PostGIS deps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend/ --output-format=github

      - name: Type check with mypy (core modules)
        run: |
          pip install mypy django-stubs
          cd backend
          mypy core users activities events clubs --ignore-missing-imports || true

      - name: Run Django system checks
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
          DJANGO_SETTINGS_MODULE: core.settings
        run: |
          cd backend
          python manage.py check

      - name: Run migrations
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-insecure-key
        run: |
          cd backend
          python manage.py test --verbosity=2

  # ──────────────────────────────────────────
  # Admin Dashboard: Lint + Type Check + Build
  # ──────────────────────────────────────────
  admin:
    name: Admin Dashboard (React/TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: |
          cd admin
          npm ci

      - name: ESLint
        run: |
          cd admin
          npm run lint

      - name: TypeScript type check
        run: |
          cd admin
          npx tsc --noEmit

      - name: Build production bundle
        run: |
          cd admin
          npm run build

  # ──────────────────────────────────────────
  # Security: Dependency vulnerability scan
  # ──────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, admin]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-60 || true

      - name: Audit Node dependencies (npm audit)
        run: |
          cd admin
          npm audit --audit-level=high || true

  # ──────────────────────────────────────────
  # E2E: Playwright tests on built admin
  # ──────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [admin]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: |
          cd admin
          npm ci

      - name: Install Playwright browsers
        run: |
          cd admin
          npx playwright install --with-deps chromium

      - name: Build admin for preview
        run: |
          cd admin
          npm run build

      - name: Start preview server and run E2E
        run: |
          cd admin
          npx vite preview --port 3000 &
          sleep 3
          npx playwright test --reporter=github
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7
