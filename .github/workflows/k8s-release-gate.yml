name: Kubernetes Release Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Set to production to run deploy placeholder"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - production

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/sport

jobs:
  build_and_test:
    name: Build/Test Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend smoke checks
        env:
          SECRET_KEY: ci-only-smoke-check-key-not-for-production
          ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_URL: postgres://sport_user:sport_pass@localhost:5432/sport_test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
          cd backend
          pip install -r requirements.txt
          python manage.py check

      - name: Admin lint and build
        run: |
          pnpm --filter admin lint
          pnpm --filter admin build

  docker_build_publish_placeholder:
    name: Docker Build/Publish Placeholder
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}-backend:ci-${{ github.sha }}

      - name: Build admin image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./admin/Dockerfile
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}-admin:ci-${{ github.sha }}

      - name: Publish placeholder (safe by default)
        if: ${{ false }}
        run: |
          echo "Intentionally disabled."
          echo "Enable with a dedicated protected workflow and registry credentials."
          echo "Required placeholders:"
          echo "- secrets.REGISTRY_USERNAME"
          echo "- secrets.REGISTRY_PASSWORD"
          echo "- immutable image tags and provenance/SBOM"

  k8s_manifest_validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
      - uses: actions/checkout@v6

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            infrastructure/k8s/namespace.yaml \
            infrastructure/k8s/config/app-configmap.yaml \
            infrastructure/k8s/config/app-secrets.template.yaml \
            infrastructure/k8s/workloads/api.yaml \
            infrastructure/k8s/workloads/worker.yaml \
            infrastructure/k8s/workloads/worker-simulation.yaml \
            infrastructure/k8s/workloads/beat.yaml \
            infrastructure/k8s/workloads/redis.yaml \
            infrastructure/k8s/workloads/brouter.yaml \
            infrastructure/k8s/workloads/admin.optional.yaml \
            infrastructure/k8s/jobs/migrate-job.yaml \
            infrastructure/k8s/network/ingress.yaml \
            infrastructure/k8s/policy/hpa.yaml \
            infrastructure/k8s/policy/pdb.yaml \
            infrastructure/k8s/optional/postgres.optional.yaml

  reliability_and_release_gate:
    name: Reliability + Release Gate
    runs-on: ubuntu-latest
    needs: [docker_build_publish_placeholder, k8s_manifest_validation]
    steps:
      - uses: actions/checkout@v6
      - name: Validate release gate artifacts
        run: python scripts/release/pre_release_check.py
      - name: Gate references
        run: |
          echo "Reliability playbook: docs/reports/RELIABILITY_AUDIT_PLAYBOOK.md"
          echo "Pre-release verification: docs/operations/PRE_RELEASE_VERIFICATION.md"
          echo "Legal/compliance package: docs/compliance/RELEASE_LEGAL_COMPLIANCE_PACKAGE.md"

  deploy_placeholder:
    name: Deploy Placeholder (Manual + Protected)
    runs-on: ubuntu-latest
    needs: [reliability_and_release_gate]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production' }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6

      - name: Deploy preconditions (placeholder)
        run: |
          echo "This job is intentionally placeholder-only."
          echo "Required setup before real deploy:"
          echo "- secrets.KUBE_CONFIG_BASE64 or OIDC-based auth"
          echo "- protected environment reviewers"
          echo "- immutable image tag promotion strategy"
          echo "- rollback validation"
          exit 1
