name: Mobile Native Smoke

on:
  pull_request:
    # Keep the workflow visible for mobile/workspace PRs, but let the cheap
    # native-scope job decide whether a full Android rebuild is warranted.
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/actions/pnpm-setup/**"
      - "version.json"
      - "scripts/validate_mobile_native_provenance.py"
      - "scripts/test_mobile_native_provenance.py"
      - "scripts/test_mobile_native_smoke_workflow.py"
      - ".github/workflows/mobile-native-smoke.yml"
  push:
    branches: [main]
    # On main, run the expensive smoke only when native inputs changed.
    paths:
      - "mobile/app.config.js"
      - "mobile/app.json"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/android/**"
      - "mobile/ios/**"
      - "mobile/plugins/**"
      - "mobile/google-services.json"
      - "mobile/GoogleService-Info.plist"
      - "mobile/assets/icon.png"
      - "mobile/assets/splash-icon.png"
      - "mobile/assets/adaptive-icon.png"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/actions/pnpm-setup/**"
      - "version.json"
      - "scripts/validate_mobile_native_provenance.py"
      - "scripts/test_mobile_native_provenance.py"
      - ".github/workflows/mobile-native-smoke.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-scope:
    name: Native scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify native-affecting changes
        id: classifier
        if: github.event_name == 'pull_request'
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/plan_affected_tests.py \
            --github-output "$GITHUB_OUTPUT"
      - name: Decide whether Gradle is required
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          NATIVE_CHANGED: ${{ steps.classifier.outputs.lane_mobile_native }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME forces a native smoke" >> "$GITHUB_OUTPUT"
          elif [ "$NATIVE_CHANGED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=native-affecting PR paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=JS/UI/assets-only PR; covered by Mobile + Visual Contract" >> "$GITHUB_OUTPUT"
          fi

      - name: Report native scope
        run: |
          echo "### Mobile Native Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run Android build:** `${{ steps.decision.outputs.run }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  android-debug:
    name: Android clean prebuild + debug compile
    needs: [native-scope]
    if: needs.native-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EAS_BUILD_PROFILE: pilot-local
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_TELEMETRY_URL: http://localhost:8001
      EXPO_PUBLIC_TELEMETRY_WS_INGEST: "false"
      EXPO_PUBLIC_ENABLE_FIREBASE: "false"
      EXPO_PUBLIC_VISION_FIXTURES: "true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Activate canonical pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          node --version
          pnpm --version
          java -version

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Expo dependency contract
        working-directory: mobile
        run: |
          pnpm exec expo install --check
          pnpm dlx expo-doctor@1.20.4 .

      - name: MMKV migration contract
        run: python -m unittest scripts/test_mobile_mmkv_v4_contract.py -v

      - name: Native provenance validator tests
        run: python -m unittest scripts/test_mobile_native_provenance.py -v

      - name: Mobile lint + typecheck
        run: |
          pnpm --dir mobile lint
          pnpm --dir mobile typecheck

      - name: MMKV durability unit tests
        run: |
          pnpm --dir mobile test -- --runInBand \
            __tests__/services/gpsEncryptedStorage.test.ts \
            __tests__/services/rideSessionService.test.ts

      - name: Resolve Expo provenance
        working-directory: mobile
        run: pnpm exec expo config --type public --json > "$RUNNER_TEMP/4velo-expo-public.json"

      - name: Clean Android prebuild
        working-directory: mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Validate generated Android provenance
        run: |
          python scripts/validate_mobile_native_provenance.py \
            --expo-config "$RUNNER_TEMP/4velo-expo-public.json" \
            --version-file version.json \
            --android-dir mobile/android \
            --git-sha "$(git rev-parse HEAD)"

      - name: Compile Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Record native artifact
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
