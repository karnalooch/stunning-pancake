name: Mobile Native Smoke

on:
  pull_request:
    # Keep the workflow visible for mobile/workspace PRs, but let the cheap
    # native-scope job decide whether a full Android rebuild is warranted.
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/actions/pnpm-setup/**"
      - "version.json"
      - "scripts/validate_mobile_native_provenance.py"
      - "scripts/test_mobile_native_provenance.py"
      - "scripts/mobile-runtime-acceptance.ps1"
      - "scripts/test_mobile_harness_contract.py"
      - "scripts/test_mobile_native_smoke_workflow.py"
      - ".github/workflows/mobile-native-smoke.yml"
  push:
    branches: [main]
    # On main, run the expensive smoke only when native inputs changed.
    paths:
      - "mobile/app.config.js"
      - "mobile/app.json"
      - "mobile/eas.json"
      - "mobile/package.json"
      - "mobile/android/**"
      - "mobile/ios/**"
      - "mobile/plugins/**"
      - "mobile/google-services.json"
      - "mobile/GoogleService-Info.plist"
      - "mobile/assets/icon.png"
      - "mobile/assets/splash-icon.png"
      - "mobile/assets/adaptive-icon.png"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/actions/pnpm-setup/**"
      - "version.json"
      - "scripts/validate_mobile_native_provenance.py"
      - "scripts/test_mobile_native_provenance.py"
      - ".github/workflows/mobile-native-smoke.yml"
  workflow_call:
    inputs:
      release:
        description: "Force release APK and publish exact-SHA runtime artifact"
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Optional exact source SHA for reusable exact-candidate validation"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-scope:
    name: Native scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
      release: ${{ steps.decision.outputs.release }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Classify direct native-affecting changes
        id: classifier
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from scripts.plan_affected_tests import (
              changed_files_from_git,
              is_mobile_native_affecting_path,
          )

          changed = changed_files_from_git(
              os.environ["CI_BASE_SHA"],
              os.environ["CI_HEAD_SHA"],
          )
          # Full Release owns Android release orchestration, so changing the
          # caller itself must still prove a real release APK.
          release_orchestration = {\n              ".github/workflows/full-release.yml",\n              ".github/workflows/t92-exact-sha-regression.yml",\n          }
          native_changed = [
              path
              for path in changed
              if is_mobile_native_affecting_path(path)
              or path in release_orchestration
          ]
          required = bool(native_changed)
          self_workflow_changed = (
              ".github/workflows/mobile-native-smoke.yml" in changed
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(
                  "direct_native_changed="
                  + ("true" if required else "false")
                  + "\n"
              )
              fh.write(
                  "self_workflow_changed="
                  + ("true" if self_workflow_changed else "false")
                  + "\n"
              )
          if native_changed:
              print("Direct native/release-affecting paths:")
              for path in native_changed:
                  print(f"- {path}")
          else:
              print("No direct native/release-affecting paths changed.")
          PY
      - name: Decide whether Gradle is required
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          NATIVE_CHANGED: ${{ steps.classifier.outputs.direct_native_changed }}
          SELF_WORKFLOW_CHANGED: ${{ steps.classifier.outputs.self_workflow_changed }}
          FORCE_RELEASE: ${{ inputs.release || false }}
        run: |
          set -euo pipefail
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "reason=caller forces native + release validation" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME forces native + release validation" >> "$GITHUB_OUTPUT"
          elif [ "$WORKFLOW_NAME" = "Mobile Native Smoke" ] && [ "$SELF_WORKFLOW_CHANGED" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=Full Release owns the heavyweight Android proof for mobile-native workflow changes" >> "$GITHUB_OUTPUT"
          elif [ "$NATIVE_CHANGED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "reason=direct native/release-affecting PR paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "reason=no direct native/release inputs changed; heavyweight Android build not required" >> "$GITHUB_OUTPUT"
          fi

      - name: Report native scope
        run: |
          echo "### Mobile Native Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run Android build:** `${{ steps.decision.outputs.run }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build release APK:** `${{ steps.decision.outputs.release }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  android-debug:
    name: Android clean prebuild + debug compile
    needs: [native-scope]
    if: needs.native-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NODE_ENV: production
      MOBILE_RUNTIME_ACCEPTANCE: "true"
      EAS_BUILD_PROFILE: pilot-local
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_TELEMETRY_URL: http://localhost:8001
      EXPO_PUBLIC_TELEMETRY_WS_INGEST: "false"
      EXPO_PUBLIC_ENABLE_FIREBASE: "false"
      EXPO_PUBLIC_VISION_FIXTURES: "true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source checkout
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          BUILT_GIT_SHA="$(git rev-parse HEAD)"
          if [ "$BUILT_GIT_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Exact source checkout mismatch: expected $EXPECTED_HEAD_SHA, got $BUILT_GIT_SHA" >&2
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Activate canonical pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          node --version
          pnpm --version
          java -version

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Expo dependency contract
        working-directory: mobile
        run: |
          pnpm exec expo install --check
          pnpm dlx expo-doctor@1.20.4 .

      - name: MMKV migration contract
        run: python -m unittest scripts/test_mobile_mmkv_v4_contract.py -v

      - name: Native provenance validator tests
        run: python -m unittest scripts/test_mobile_native_provenance.py -v

      - name: Mobile runtime acceptance harness contract
        run: python -m unittest scripts/test_mobile_harness_contract.py -v

      - name: Mobile lint + typecheck
        run: |
          pnpm --dir mobile lint
          pnpm --dir mobile typecheck

      - name: MMKV durability unit tests
        run: |
          pnpm --dir mobile test -- --runInBand \
            __tests__/services/gpsEncryptedStorage.test.ts \
            __tests__/services/rideSessionService.test.ts

      - name: Resolve Expo provenance
        working-directory: mobile
        run: |
          pnpm exec expo config --type public --json > "$RUNNER_TEMP/4velo-expo-public.json"
          python - "$RUNNER_TEMP/4velo-expo-public.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          updates = config.get("updates") or {}
          if updates.get("enabled") is not False:
              raise SystemExit("runtime acceptance requires Expo updates.enabled=false")
          extra = config.get("extra") or {}
          if extra.get("EXPO_PUBLIC_VISION_FIXTURES") != "true":
              raise SystemExit("runtime acceptance requires EXPO_PUBLIC_VISION_FIXTURES=true")
          PY

      - name: Clean Android prebuild
        working-directory: mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Validate generated Android provenance
        run: |
          python scripts/validate_mobile_native_provenance.py \
            --expo-config "$RUNNER_TEMP/4velo-expo-public.json" \
            --version-file version.json \
            --android-dir mobile/android \
            --git-sha "$(git rev-parse HEAD)"

      - name: Compile Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Record debug artifact
        run: |
          DEBUG_APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$DEBUG_APK"
          sha256sum "$DEBUG_APK"
          ls -lh "$DEBUG_APK"

      # Native/release-affecting PRs prove both debug and release packaging.
      # JS/UI/assets-only and unrelated infra PRs never reach this job.
      - name: Harden Gradle release memory
        if: needs.native-scope.outputs.release == 'true'
        working-directory: mobile/android
        run: |
          GRADLE_PROPERTIES="gradle.properties"
          grep -F -- "-Xmx2048m" "$GRADLE_PROPERTIES"
          grep -F -- "-XX:MaxMetaspaceSize=512m" "$GRADLE_PROPERTIES"
          sed -i 's/-Xmx2048m/-Xmx4096m/' "$GRADLE_PROPERTIES"
          sed -i 's/-XX:MaxMetaspaceSize=512m/-XX:MaxMetaspaceSize=1g/' "$GRADLE_PROPERTIES"
          grep -F -- "-Xmx4096m" "$GRADLE_PROPERTIES"
          grep -F -- "-XX:MaxMetaspaceSize=1g" "$GRADLE_PROPERTIES"

      - name: Compile Android release APK
        if: needs.native-scope.outputs.release == 'true'
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Record release artifact
        if: needs.native-scope.outputs.release == 'true'
        run: |
          RELEASE_APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$RELEASE_APK"
          sha256sum "$RELEASE_APK"
          ls -lh "$RELEASE_APK"

      - name: Prepare exact-SHA runtime artifact
        if: needs.native-scope.outputs.release == 'true'
        env:
          SOURCE_HEAD_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          RELEASE_APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          ARTIFACT_DIR="artifacts/mobile-runtime"
          BUILT_GIT_SHA="$(git rev-parse HEAD)"
          if [ "$BUILT_GIT_SHA" != "$SOURCE_HEAD_SHA" ]; then
            echo "Built Git SHA mismatch: expected $SOURCE_HEAD_SHA, got $BUILT_GIT_SHA" >&2
            exit 1
          fi
          APK_SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          mkdir -p "$ARTIFACT_DIR"
          cp "$RELEASE_APK" "$ARTIFACT_DIR/app-release.apk"
          export BUILT_GIT_SHA APK_SHA256
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "sourceHeadSha": os.environ["SOURCE_HEAD_SHA"],
              "builtGitSha": os.environ["BUILT_GIT_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "apkSha256": os.environ["APK_SHA256"],
              "packageId": "com.sport.athlete",
              "buildProfile": os.environ["EAS_BUILD_PROFILE"],
              "updatesEnabled": False,
              "visionFixtures": os.environ["EXPO_PUBLIC_VISION_FIXTURES"],
              "runtimeAcceptance": os.environ["MOBILE_RUNTIME_ACCEPTANCE"],
              "nodeEnv": os.environ["NODE_ENV"],
          }
          Path("artifacts/mobile-runtime/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-SHA runtime artifact
        if: needs.native-scope.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-runtime-${{ github.run_id }}
          path: artifacts/mobile-runtime
          if-no-files-found: error
          retention-days: 7
