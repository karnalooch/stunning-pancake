name: Mobile Native Smoke

on:
  pull_request:
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-native-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-debug:
    name: Android clean prebuild + debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EAS_BUILD_PROFILE: pilot-local
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_TELEMETRY_URL: http://localhost:8001
      EXPO_PUBLIC_TELEMETRY_WS_INGEST: "false"
      EXPO_PUBLIC_ENABLE_FIREBASE: "false"
      EXPO_PUBLIC_VISION_FIXTURES: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Activate canonical pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          node --version
          pnpm --version
          java -version

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Expo dependency contract
        working-directory: mobile
        run: |
          pnpm exec expo install --check
          pnpm dlx expo-doctor@1.20.4 .

      - name: MMKV migration contract
        run: python -m unittest scripts/test_mobile_mmkv_v4_contract.py -v

      - name: Mobile lint + typecheck
        run: |
          pnpm --dir mobile lint
          pnpm --dir mobile typecheck

      - name: MMKV durability unit tests
        run: |
          pnpm --dir mobile test -- --runInBand \
            __tests__/services/gpsEncryptedStorage.test.ts \
            __tests__/services/rideSessionService.test.ts

      - name: Clean Android prebuild
        working-directory: mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Compile Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Record native artifact
        run: |
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
