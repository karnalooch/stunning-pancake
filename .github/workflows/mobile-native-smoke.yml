name: Mobile Native Smoke

on:
  pull_request:
    paths:
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/validate_mobile_native_provenance.py"
      - "scripts/test_mobile_native_provenance.py"
      - "scripts/mobile-runtime-acceptance.ps1"
      - "scripts/test_mobile_harness_contract.py"
      - ".github/workflows/mobile-native-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-debug:
    name: Android clean prebuild + debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EAS_BUILD_PROFILE: pilot-local
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_PUBLIC_TELEMETRY_URL: http://localhost:8001
      EXPO_PUBLIC_TELEMETRY_WS_INGEST: "false"
      EXPO_PUBLIC_ENABLE_FIREBASE: "false"
      EXPO_PUBLIC_VISION_FIXTURES: "true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Activate canonical pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          node --version
          pnpm --version
          java -version

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Expo dependency contract
        working-directory: mobile
        run: |
          pnpm exec expo install --check
          pnpm dlx expo-doctor@1.20.4 .

      - name: MMKV migration contract
        run: python -m unittest scripts/test_mobile_mmkv_v4_contract.py -v

      - name: Native provenance validator tests
        run: python -m unittest scripts/test_mobile_native_provenance.py -v

      - name: Mobile runtime acceptance harness contract
        run: python -m unittest scripts/test_mobile_harness_contract.py -v

      - name: Mobile lint + typecheck
        run: |
          pnpm --dir mobile lint
          pnpm --dir mobile typecheck

      - name: MMKV durability unit tests
        run: |
          pnpm --dir mobile test -- --runInBand \
            __tests__/services/gpsEncryptedStorage.test.ts \
            __tests__/services/rideSessionService.test.ts

      - name: Resolve Expo provenance
        working-directory: mobile
        run: pnpm exec expo config --type public --json > "$RUNNER_TEMP/4velo-expo-public.json"

      - name: Clean Android prebuild
        working-directory: mobile
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Validate generated Android provenance
        run: |
          python scripts/validate_mobile_native_provenance.py \
            --expo-config "$RUNNER_TEMP/4velo-expo-public.json" \
            --version-file version.json \
            --android-dir mobile/android \
            --git-sha "$(git rev-parse HEAD)"

      - name: Compile Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Harden Gradle release memory
        working-directory: mobile/android
        run: |
          GRADLE_PROPERTIES="gradle.properties"
          grep -F -- "-Xmx2048m" "$GRADLE_PROPERTIES"
          grep -F -- "-XX:MaxMetaspaceSize=512m" "$GRADLE_PROPERTIES"
          sed -i 's/-Xmx2048m/-Xmx4096m/' "$GRADLE_PROPERTIES"
          sed -i 's/-XX:MaxMetaspaceSize=512m/-XX:MaxMetaspaceSize=1g/' "$GRADLE_PROPERTIES"
          grep -F -- "-Xmx4096m" "$GRADLE_PROPERTIES"
          grep -F -- "-XX:MaxMetaspaceSize=1g" "$GRADLE_PROPERTIES"

      - name: Compile Android release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Record native artifacts
        run: |
          DEBUG_APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          sha256sum "$DEBUG_APK"
          sha256sum "$RELEASE_APK"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Prepare exact-SHA runtime artifact
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          RELEASE_APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          ARTIFACT_DIR="artifacts/mobile-runtime"
          BUILT_GIT_SHA="$(git rev-parse HEAD)"
          APK_SHA256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          mkdir -p "$ARTIFACT_DIR"
          cp "$RELEASE_APK" "$ARTIFACT_DIR/app-release.apk"
          export BUILT_GIT_SHA APK_SHA256
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "sourceHeadSha": os.environ["SOURCE_HEAD_SHA"],
              "builtGitSha": os.environ["BUILT_GIT_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "apkSha256": os.environ["APK_SHA256"],
              "packageId": "com.sport.athlete",
              "buildProfile": os.environ["EAS_BUILD_PROFILE"],
          }
          Path("artifacts/mobile-runtime/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-SHA runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-runtime-${{ github.run_id }}
          path: artifacts/mobile-runtime
          if-no-files-found: error
          retention-days: 7
