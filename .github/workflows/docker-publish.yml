name: SPORT Container Registry — Build & Push (reusable)

# Callable-only reusable workflow (T24).
# Inputs are pre-validated by the caller's `prepare-publish` job, so this
# workflow performs no validation and infers no tags from github.ref.
#
# This workflow must never be triggered directly. It exposes `workflow_call`
# only and does not declare any direct triggers or `secrets: inherit`.

on:
  workflow_call:
    inputs:
      validated_sha:
        description: Exact 40-character SHA that passed the upstream CI gate.
        type: string
        required: true
      validated_ref:
        description: The upstream validated ref (refs/heads/<branch> or refs/tags/vX.Y.Z).
        type: string
        required: true
      publish_kind:
        description: 'Either "branch" or "tag". Determines which tags are pushed.'
        type: string
        required: true
      version:
        description: "Strict semver tag value (X.Y.Z) when publish_kind == 'tag', otherwise ''."
        type: string
        required: false
        default: ''
      major_minor:
        description: "X.Y (major.minor) when publish_kind == 'tag', otherwise ''."
        type: string
        required: false
        default: ''
    outputs:
      slsa_subjects:
        description: Base64-encoded sha256sum-style subjects for SLSA provenance.
        value: ${{ jobs.prepare-provenance-subjects.outputs.subjects }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-backend
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-admin
  # Versioned / latest tag fragments — never depend on another env key declared
  # at the same level. Each image produces exactly one build-push-action call
  # whose `tags:` list is computed inline from inputs and the immutable SHA.
  BACKEND_VERSION_TAG: ${{ inputs.version }}
  BACKEND_MAJOR_MINOR_TAG: ${{ inputs.major_minor }}
  ADMIN_VERSION_TAG: ${{ inputs.version }}

jobs:
  # ──────────────────────────────────────────
  # Build and push backend Docker image — exactly one build-push-action call.
  # Tag list (computed once):
  #   * sha-<full validated SHA>  — always pushed
  #   * latest                     — only when publish_kind == 'branch'
  #   * <version>, <major_minor>   — only when publish_kind == 'tag'
  # ──────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-backend.outputs.digest }}

    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute backend tags (raw, no semver inference)
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=sha-${{ inputs.validated_sha }}
            type=raw,value=latest,enable=${{ inputs.publish_kind == 'branch' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.publish_kind == 'tag' }}
            type=raw,value=${{ inputs.major_minor }},enable=${{ inputs.publish_kind == 'tag' }}

      - name: Build and push backend (single invocation, all tags at once)
        id: build-backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # Build and push admin dashboard image — exactly one build-push-action call.
  # Tag list (computed once):
  #   * sha-<full validated SHA>  — always pushed
  #   * latest                     — only when publish_kind == 'branch'
  #   * <version>                  — only when publish_kind == 'tag'
  # Admin does NOT receive a <major_minor> tag.
  # ──────────────────────────────────────────
  build-admin:
    name: Build Admin Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build-admin.outputs.digest }}

    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute admin tags (raw, no semver inference)
        id: meta-admin
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.ADMIN_IMAGE }}
          tags: |
            type=raw,value=sha-${{ inputs.validated_sha }}
            type=raw,value=latest,enable=${{ inputs.publish_kind == 'branch' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.publish_kind == 'tag' }}

      - name: Build and push admin (single invocation, all tags at once)
        id: build-admin
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # Supply chain: expose immutable image digests as SLSA Generic Generator
  # subjects. The caller signs these after this reusable workflow succeeds.
  # ──────────────────────────────────────────
  prepare-provenance-subjects:
    name: Prepare SLSA subjects
    runs-on: ubuntu-latest
    needs: [build-backend, build-admin]
    permissions:
      contents: read
    outputs:
      subjects: ${{ steps.subjects.outputs.subjects }}
    steps:
      - name: Encode immutable image digests
        id: subjects
        shell: bash
        env:
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          ADMIN_DIGEST: ${{ needs.build-admin.outputs.digest }}
          BACKEND_IMAGE_REF: ${{ env.BACKEND_IMAGE }}
          ADMIN_IMAGE_REF: ${{ env.ADMIN_IMAGE }}
        run: |
          set -euo pipefail
          for digest in "$BACKEND_DIGEST" "$ADMIN_DIGEST"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest: $digest" >&2
              exit 1
            fi
          done
          {
            printf '%s  %s@%s\n' "${BACKEND_DIGEST#sha256:}" "$BACKEND_IMAGE_REF" "$BACKEND_DIGEST"
            printf '%s  %s@%s\n' "${ADMIN_DIGEST#sha256:}" "$ADMIN_IMAGE_REF" "$ADMIN_DIGEST"
          } > slsa-subjects.txt
          echo "subjects=$(base64 -w0 slsa-subjects.txt)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────
  # Security: Trivy container vulnerability scan (always scans the SHA tag).
  # The SHA tag is reconstructed inline from inputs (no same-level env self-ref).
  # ──────────────────────────────────────────
  scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-admin]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image (SHA tag, never :latest)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:sha-${{ inputs.validated_sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Scan admin image (SHA tag, never :latest)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.ADMIN_IMAGE }}:sha-${{ inputs.validated_sha }}
          format: sarif
          output: trivy-admin.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload admin scan results
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-admin.sarif
          category: trivy-admin
