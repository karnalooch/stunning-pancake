name: SPORT Container Registry — Build & Push (reusable)

# Callable-only reusable workflow (T24).
# Inputs are pre-validated by the caller's `prepare-publish` job, so this
# workflow performs no validation and infers no tags from github.ref.
#
# This workflow must never be triggered directly. It exposes `workflow_call`
# only and does not declare any direct triggers or `secrets: inherit`.

on:
  workflow_call:
    inputs:
      validated_sha:
        description: Exact 40-character SHA that passed the upstream CI gate.
        type: string
        required: true
      validated_ref:
        description: The upstream validated ref (refs/heads/<branch> or refs/tags/vX.Y.Z).
        type: string
        required: true
      publish_kind:
        description: 'Either "branch" or "tag". Determines which tags are pushed.'
        type: string
        required: true
      version:
        description: "Strict semver tag value (X.Y.Z) when publish_kind == 'tag', otherwise ''."
        type: string
        required: false
        default: ''
      major_minor:
        description: "X.Y (major.minor) when publish_kind == 'tag', otherwise ''."
        type: string
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-backend
  BACKEND_SHA_TAG: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sport-backend:sha-${{ inputs.validated_sha }}
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/sport-admin
  ADMIN_SHA_TAG: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sport-admin:sha-${{ inputs.validated_sha }}

jobs:
  # ──────────────────────────────────────────
  # Build and push backend Docker image
  # ──────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend (immutable SHA)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_SHA_TAG }}

      - name: Tag backend as latest on default branch
        if: inputs.publish_kind == 'branch'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha

      - name: Tag backend as ${{ inputs.version }}
        if: inputs.publish_kind == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ inputs.version }}
            ${{ env.BACKEND_IMAGE }}:${{ inputs.major_minor }}
          cache-from: type=gha

  # ──────────────────────────────────────────
  # Build and push admin dashboard image
  # ──────────────────────────────────────────
  build-admin:
    name: Build Admin Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout validated SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.validated_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push admin (immutable SHA, monorepo root context)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: ${{ env.ADMIN_SHA_TAG }}

      - name: Tag admin as latest on default branch
        if: inputs.publish_kind == 'branch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:latest
          cache-from: type=gha

      - name: Tag admin as ${{ inputs.version }}
        if: inputs.publish_kind == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: ${{ env.ADMIN_IMAGE }}:${{ inputs.version }}
          cache-from: type=gha

  # ──────────────────────────────────────────
  # Security: Trivy container vulnerability scan (always scans the SHA tag)
  # ──────────────────────────────────────────
  scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-admin]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan backend image (SHA tag, never :latest)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.BACKEND_SHA_TAG }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Scan admin image (SHA tag, never :latest)
        # v0.35.0 — GHSA-69fq-xp46-6x23 (supply chain), GHSA-9p44-j4g5-cfx5 (script injection)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.ADMIN_SHA_TAG }}
          format: sarif
          output: trivy-admin.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload admin scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-admin.sarif
          category: trivy-admin
