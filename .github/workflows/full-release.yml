name: Full / Release Validation

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Optional exact source SHA for reusable exact-candidate validation"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/full-release.yml"
      - ".github/workflows/mobile-native-smoke.yml"
      - ".github/workflows/home-lab.yml"
      - ".github/workflows/k8s-release-gate.yml"
      - ".github/workflows/t92-exact-sha-regression.yml"
      - "scripts/run-quality-baseline.sh"
      - "scripts/test_security_tooling_workflows.py"
      - "backend/test_rls.py"
      - "telemetry/integration_durable_ingest.py"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional operator note for this full validation run"
        required: false
        type: string
  schedule:
    - cron: "15 2 * * *"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.21.0"

jobs:
  repo-regression:
    name: Full monorepo regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: fourvelo_ci
          POSTGRES_USER: fourvelo_ci
          POSTGRES_PASSWORD: fourvelo_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fourvelo_ci -d fourvelo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgres://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: full-release-ci-only-key
      DJANGO_SETTINGS_MODULE: core.settings

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Exact source checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $ACTUAL_SOURCE_SHA" >&2
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up pnpm workspace
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
          python -m pip install "ruff>=0.8,<0.16" pytest pytest-django
          python -m pip install -r backend/requirements.txt
          python -m pip install -r telemetry/requirements.txt -r telemetry/requirements-dev.txt

      - name: Release tag/version contract
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/versioning.py check --tag "${GITHUB_REF_NAME}"

      - name: T19 PostgreSQL/PostGIS RLS integration gate
        working-directory: backend
        run: python -m pytest test_rls.py -v

      - name: Canonical full quality baseline
        run: bash scripts/run-quality-baseline.sh

  telemetry-integration:
    name: Telemetry durable ingest integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB: fourvelo_ci
          POSTGRES_USER: fourvelo_ci
          POSTGRES_PASSWORD: fourvelo_ci_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://fourvelo_ci:fourvelo_ci_pass@localhost:5432/fourvelo_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-insecure-key-for-telemetry-t20-proof
      TELEMETRY_INGEST_JWT_REQUIRED: "1"
      TELEMETRY_INGEST_AUDIENCE_REQUIRED: "1"
      TELEMETRY_INGEST_AUDIENCE: telemetry
      GLOBAL_PROTECTION_MODE: "off"
      TELEMETRY_INGEST_QUEUE: "0"
      TELEMETRY_SKIP_BROADCAST: "1"
      TELEMETRY_DB_POOL_MIN: "1"
      TELEMETRY_DB_POOL_MAX: "4"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Exact source checkout mismatch: expected $EXPECTED_SOURCE_SHA, got $ACTUAL_SOURCE_SHA"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install telemetry dependencies
        run: python -m pip install -r telemetry/requirements.txt -r telemetry/requirements-dev.txt

      - name: Bootstrap telemetry-owned schema
        working-directory: telemetry
        run: python schema_bootstrap.py

      - name: Run T20 durable ingest integration proof
        working-directory: telemetry
        run: >-
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          python -m pytest -p pytest_asyncio.plugin
          integration_durable_ingest.py -v

  android-native:
    name: Full Android native smoke
    # Gumball CI Cost Governor: PRs never burn an APK build automatically.
    # Exact-SHA PR proof is requested explicitly through the Proof Broker.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/mobile-native-smoke.yml
    with:
      release: true
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

  home-lab:
    name: Home Lab configuration proof
    uses: ./.github/workflows/home-lab.yml
    with:
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

  k8s-release:
    name: Kubernetes + release proof
    uses: ./.github/workflows/k8s-release-gate.yml
    with:
      deploy_target: none
      source_sha: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

  full-release-gate:
    name: Full Release Gate
    if: always()
    needs:
      - repo-regression
      - telemetry-integration
      - android-native
      - home-lab
      - k8s-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce heavyweight validation matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO_REGRESSION: ${{ needs.repo-regression.result }}
          TELEMETRY_INTEGRATION: ${{ needs.telemetry-integration.result }}
          ANDROID_NATIVE: ${{ needs.android-native.result }}
          HOME_LAB: ${{ needs.home-lab.result }}
          K8S_RELEASE: ${{ needs.k8s-release.result }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name expected success, got $result"
              failed=1
            else
              echo "$name: success"
            fi
          }
          check "Full monorepo regression" "$REPO_REGRESSION"
          check "Telemetry durable ingest integration" "$TELEMETRY_INTEGRATION"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$ANDROID_NATIVE" != "skipped" ]; then
              echo "::error::Full Android native smoke expected skipped on pull_request, got $ANDROID_NATIVE"
              failed=1
            else
              echo "Full Android native smoke: skipped on pull_request by Gumball cost policy"
            fi
          else
            check "Full Android native smoke" "$ANDROID_NATIVE"
          fi
          check "Home Lab configuration proof" "$HOME_LAB"
          check "Kubernetes + release proof" "$K8S_RELEASE"
          exit "$failed"
