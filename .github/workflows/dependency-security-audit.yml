name: Temporary dependency security audit

# Final confirmation workflow; remove before merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.head_ref == 'security/dependabot-alerts-2026-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify lockfile
        run: pnpm install --lockfile-only --frozen-lockfile
      - name: Audit dependency graph
        shell: bash
        run: |
          set +e
          pnpm audit --json > audit.json
          status=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const advisories = Object.values(data.advisories || {});
          advisories.sort((a, b) => {
            const rank = {critical: 0, high: 1, moderate: 2, low: 3, info: 4};
            return (rank[a.severity] ?? 9) - (rank[b.severity] ?? 9)
              || String(a.module_name).localeCompare(String(b.module_name))
              || Number(a.id) - Number(b.id);
          });
          console.log('AUDIT_SUMMARY_BEGIN');
          for (const a of advisories) {
            const versions = [...new Set((a.findings || []).map(f => f.version))].join(',');
            console.log([
              a.severity,
              a.module_name,
              versions,
              a.vulnerable_versions,
              a.patched_versions || 'NONE',
              a.github_advisory_id || a.id,
              a.title
            ].join('\t'));
          }
          console.log('AUDIT_SUMMARY_END');
          console.log('AUDIT_METADATA\t' + JSON.stringify(data.metadata || {}));
          NODE
          echo "pnpm audit exit code: $status"
          exit 0

      - name: Check security-fix release ages
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('child_process');
          const targets = [
            ['shell-quote','1.10.0'],
            ['tar','7.5.21'],
            ['@xmldom/xmldom','0.8.15'],
            ['@xmldom/xmldom','0.9.12'],
            ['brace-expansion','1.1.18'],
            ['brace-expansion','2.1.4'],
            ['brace-expansion','5.0.9'],
            ['browserslist','4.28.7'],
            ['fast-uri','3.1.6'],
            ['form-data','4.0.6'],
            ['js-yaml','3.15.2'],
            ['js-yaml','4.3.2'],
            ['linkify-it','5.0.2'],
            ['nanoid','3.3.18'],
            ['postcss','8.5.23'],
            ['react-router-dom','7.18.2'],
            ['svgo','3.3.5'],
            ['undici','6.28.0'],
            ['undici','7.29.0'],
            ['vitest','4.1.11'],
            ['baseline-browser-mapping','2.11.0'],
            ['protobufjs','7.6.5'],
            ['esbuild','0.28.1'],
            ['image-size','2.0.3']
          ];
          console.log('RELEASE_AGES_BEGIN');
          for (const [name, version] of targets) {
            try {
              const raw = execFileSync('pnpm', ['view', `${name}@${version}`, 'time', '--json'], {encoding:'utf8'});
              const times = JSON.parse(raw);
              const published = times[version] || 'UNKNOWN';
              console.log([name, version, published].join('\t'));
            } catch (e) {
              console.log([name, version, 'LOOKUP_FAILED'].join('\t'));
            }
          }
          console.log('RELEASE_AGES_END');
          NODE
