name: T18 Ruff format probe

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  ruff-format-diff:
    name: Ruff 0.15 formatter diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Show canonical diff
        run: |
          pip install "ruff==0.15.22"
          ruff format --diff telemetry/schema.py telemetry/test_schema.py
