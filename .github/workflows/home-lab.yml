name: Home lab configuration
concurrency:
  group: home-lab-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_call:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.home.yml'
      - '.env.home.example'
      - 'scripts/backup_crypto.py'
      - 'scripts/home_lab.py'
      - 'scripts/admin_pilot_smoke.py'
      - 'scripts/requirements-home-lab.txt'
      - 'scripts/test_backup_crypto.py'
      - 'scripts/test_home_lab.py'
      - 'scripts/test_admin_pilot_smoke.py'
      - 'scripts/t76_chaos.py'
      - 'scripts/test_t76_chaos.py'
      - 'backend/activities/management/commands/seed_p3_recovery_fixture.py'
      - '.github/workflows/home-lab.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.home.yml'
      - '.env.home.example'
      - 'scripts/backup_crypto.py'
      - 'scripts/home_lab.py'
      - 'scripts/requirements-home-lab.txt'
      - 'scripts/test_backup_crypto.py'
      - 'scripts/test_home_lab.py'
      - 'scripts/t76_chaos.py'
      - 'scripts/test_t76_chaos.py'
      - 'backend/activities/management/commands/seed_p3_recovery_fixture.py'
      - '.github/workflows/home-lab.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Exact source checkout mismatch: expected $EXPECTED_HEAD_SHA, got $ACTUAL_HEAD_SHA" >&2
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install home-lab security dependencies
        run: python -m pip install -r scripts/requirements-home-lab.txt
      - name: Test home-lab control and backup crypto
        working-directory: scripts
        run: python -m unittest test_home_lab.py test_backup_crypto.py test_t76_chaos.py test_admin_pilot_smoke.py
      - name: Initialize canonical home-lab environment
        run: python scripts/home_lab.py init
      - name: Validate canonical layered home-lab Compose model
        run: python scripts/home_lab.py config
      - name: Validate optional layered Compose profiles
        run: python scripts/home_lab.py config --routing --simulation --tracking --all-admin

      - name: Decide canonical runtime-smoke owner
        id: runtime-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME validates the canonical runtime path" >> "$GITHUB_OUTPUT"
          elif [ "$WORKFLOW_NAME" != "Home lab configuration" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=calling release workflow owns the canonical runtime proof" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Fxq ".github/workflows/home-lab.yml"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Full Release owns the duplicate runtime proof for home-lab workflow changes" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=direct Home Lab runtime inputs changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Report runtime-smoke ownership
        run: |
          echo "### T90 Home Lab runtime proof" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run cold-start smoke:** `${{ steps.runtime-scope.outputs.run }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Reason:** ${{ steps.runtime-scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cold-start smoke to DEV ENV READY
        id: runtime-smoke
        if: steps.runtime-scope.outputs.run == 'true'
        run: python scripts/home_lab.py cold-start-smoke

      - name: Upload T90 exact-SHA evidence
        if: steps.runtime-smoke.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t90-dev-env-ready-${{ github.run_id }}
          path: backups/home-lab/evidence/t90-dev-env-ready-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Tear down canonical Home Lab
        if: always() && steps.runtime-scope.outputs.run == 'true'
        run: python scripts/home_lab.py down
