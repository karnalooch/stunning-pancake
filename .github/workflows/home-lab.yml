name: Home lab configuration
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  workflow_call:
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.home.yml'
      - 'docker-compose.override.yml'
      - '.env.home.example'
      - 'scripts/backup_crypto.py'
      - 'scripts/home_lab.py'
      - 'scripts/requirements-home-lab.txt'
      - 'scripts/test_backup_crypto.py'
      - 'scripts/test_home_lab.py'
      - 'scripts/t76_chaos.py'
      - 'scripts/test_t76_chaos.py'
      - 'backend/activities/management/commands/seed_p3_recovery_fixture.py'
      - '.github/workflows/home-lab.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.home.yml'
      - 'docker-compose.override.yml'
      - '.env.home.example'
      - 'scripts/backup_crypto.py'
      - 'scripts/home_lab.py'
      - 'scripts/requirements-home-lab.txt'
      - 'scripts/test_backup_crypto.py'
      - 'scripts/test_home_lab.py'
      - 'scripts/t76_chaos.py'
      - 'scripts/test_t76_chaos.py'
      - 'backend/activities/management/commands/seed_p3_recovery_fixture.py'
      - '.github/workflows/home-lab.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install home-lab security dependencies
        run: python -m pip install -r scripts/requirements-home-lab.txt
      - name: Test home-lab control and backup crypto
        working-directory: scripts
        run: python -m unittest test_home_lab.py test_backup_crypto.py test_t76_chaos.py
      - name: Validate layered home-lab Compose model
        run: >-
          docker compose --env-file .env.home.example
          -f docker-compose.yml -f docker-compose.home.yml
          config --quiet
      - name: Validate optional layered Compose profiles
        run: >-
          docker compose --env-file .env.home.example
          -f docker-compose.yml -f docker-compose.home.yml
          --profile routing --profile simulation --profile tracking --profile all-admin
          config --quiet
