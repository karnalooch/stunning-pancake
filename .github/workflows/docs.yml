name: Documentation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_docs_i18n.py'
      - 'docs/locales/**'
      - 'docs/en/**'
      - 'docs/pl/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_docs_i18n.py'
      - 'docs/locales/**'
      - 'docs/en/**'
      - 'docs/pl/**'

jobs:
  links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check relative links in docs/
        run: python scripts/check_docs_links.py

      - name: Check EN/PL paired docs (registry)
        run: python scripts/check_docs_i18n.py
