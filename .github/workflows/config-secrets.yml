name: Configuration secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  signing-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest test_check_config_secrets
        working-directory: scripts
      - run: python scripts/check_config_secrets.py
