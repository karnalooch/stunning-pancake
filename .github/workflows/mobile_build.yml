name: SPORT Mobile Build (Android)

on:
  push:
    branches: [ main ]
    paths:
      - 'user/**'
      - '.github/workflows/mobile_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          
      - name: Install dependencies
        run: |
          cd user
          flutter pub get
          
      - name: Regenerate Platform Folders
        run: |
          cd user
          flutter create . --platforms android
          
      - name: Build APK
        run: |
          cd user
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sport-android-apk
          path: user/build/app/outputs/flutter-apk/app-release.apk
