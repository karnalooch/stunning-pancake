name: Fail-closed auto merge

on:
  pull_request_target:
    types: [ready_for_review, reopened, synchronize, edited, closed]
  workflow_run:
    workflows: ["4VELO CI/CD Pipeline", "Mobile Native Smoke"]
    types: [completed]
  check_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: fail-closed-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  evaluate:
    name: Evaluate safe auto merge
    if: >-
      github.event_name != 'check_run' ||
      github.event.check_run.name == 'Kilo Code Review' ||
      github.event.check_run.name == 'Aggregate CI gate' ||
      github.event.check_run.name == 'Android clean prebuild + debug compile'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Evaluate eligible pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          AUTOMATION_EVENT_NAME: ${{ github.event_name }}
          AUTOMATION_EVENT_ACTION: ${{ github.event.action || '' }}
          AUTOMATION_PR_MERGED: ${{ github.event.pull_request.merged || false }}
          AUTOMATION_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          AUTOMATION_PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          AUTOMATION_PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: python scripts/auto_merge.py
