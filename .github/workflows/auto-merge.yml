name: Fail-closed auto merge

on:
  pull_request_target:
    types: [ready_for_review, reopened, synchronize, edited]
  workflow_run:
    workflows: ["4VELO CI/CD Pipeline", "Kubernetes Release Gate"]
    types: [completed]
  check_run:
    types: [completed]
  workflow_dispatch:

concurrency:
  group: fail-closed-auto-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  evaluate:
    name: Evaluate safe auto merge
    if: >-
      github.event_name != 'check_run' ||
      github.event.check_run.name == 'Kilo Code Review' ||
      github.event.check_run.name == 'Aggregate CI gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Evaluate eligible pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/auto_merge.py
