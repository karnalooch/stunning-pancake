name: T69 one-shot lockfile sync

on:
  push:
    branches:
      - fix/p3-encrypted-gps-mmkv

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/p3-encrypted-gps-mmkv
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Commit lockfile and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/t69-lockfile-sync.yml
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/t69-lockfile-sync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(mobile): synchronize encrypted GPS storage dependencies"
          git push origin HEAD:fix/p3-encrypted-gps-mmkv
