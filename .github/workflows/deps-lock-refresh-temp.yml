name: Temporary dependency lock refresh

on:
  push:
    branches:
      - chore/deps-latest-stable-2026-09
    paths:
      - .github/workflows/deps-lock-refresh-temp.yml
      - admin/package.json
      - mobile/package.json
      - packages/api-client/package.json
      - pnpm-workspace.yaml

permissions:
  contents: write

concurrency:
  group: deps-lock-refresh-chore-deps-latest-stable-2026-09
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/deps-latest-stable-2026-09
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen lockfile
        run: pnpm install --lockfile-only --frozen-lockfile

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push origin HEAD:chore/deps-latest-stable-2026-09
