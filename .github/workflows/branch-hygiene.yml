name: Branch hygiene

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prune-merged-head:
    name: Delete merged PR branch
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete branch only when ref still matches merged head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          merged_head_sha = os.environ["MERGED_HEAD_SHA"]
          token = os.environ["GH_TOKEN"]
          encoded_ref = urllib.parse.quote(branch, safe="")
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "4velo-merged-branch-cleanup",
          }

          def request(method, path):
              req = urllib.request.Request(
                  f"https://api.github.com/{path}",
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          ref = request("GET", f"repos/{repository}/git/ref/heads/{encoded_ref}")
          if ref is None:
              print(f"Branch {branch!r} is already absent.")
              raise SystemExit(0)

          current_sha = ref["object"]["sha"]
          if current_sha != merged_head_sha:
              raise SystemExit(
                  f"Refused to delete {branch!r}: current SHA {current_sha} "
                  f"does not match merged head SHA {merged_head_sha}."
              )

          dependents = request(
              "GET",
              f"repos/{repository}/pulls?state=open&base={encoded_ref}&per_page=1",
          ) or []
          if dependents:
              print(
                  f"Keeping merged branch {branch!r}: it is still the base of "
                  f"open PR #{dependents[0]['number']}."
              )
              raise SystemExit(0)

          request("DELETE", f"repos/{repository}/git/refs/heads/{encoded_ref}")
          print(f"Deleted merged branch {branch!r} at {merged_head_sha}.")
          PY

  prune-contained-manual:
    name: Prune branches fully contained in main
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete only unprotected branches with no unique commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["REPOSITORY"]
          owner = repository.split("/", 1)[0]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "4velo-safe-branch-prune",
          }

          def api(method, path):
              req = urllib.request.Request(
                  f"https://api.github.com/{path}",
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} failed: {exc.code} {detail}") from exc

          branches = []
          page = 1
          while True:
              batch = api("GET", f"repos/{repository}/branches?per_page=100&page={page}") or []
              branches.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          deleted = []
          kept = []
          for item in branches:
              branch = item["name"]
              if branch == "main" or branch.startswith("dependabot/") or item.get("protected"):
                  kept.append((branch, "protected/kept"))
                  continue

              head_query = urllib.parse.quote(f"{owner}:{branch}", safe="")
              pulls = api("GET", f"repos/{repository}/pulls?state=open&head={head_query}&per_page=1") or []
              if pulls:
                  kept.append((branch, "head of open PR"))
                  continue

              encoded_branch = urllib.parse.quote(branch, safe="")
              dependents = api(
                  "GET",
                  f"repos/{repository}/pulls?state=open&base={encoded_branch}&per_page=1",
              ) or []
              if dependents:
                  kept.append((branch, f"base of open PR #{dependents[0]['number']}"))
                  continue

              comparison = api("GET", f"repos/{repository}/compare/main...{encoded_branch}")
              if comparison is None or int(comparison.get("ahead_by", -1)) != 0:
                  kept.append((branch, "contains unique commits"))
                  continue

              api("DELETE", f"repos/{repository}/git/refs/heads/{encoded_branch}")
              deleted.append(branch)

          print(f"Deleted {len(deleted)} branches fully contained in main.")
          for branch in deleted:
              print(f"DELETE {branch}")
          print(f"Kept {len(kept)} branches.")
          for branch, reason in kept:
              print(f"KEEP {branch}: {reason}")
          PY
