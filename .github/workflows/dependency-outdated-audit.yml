name: Temporary dependency outdated audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-outdated-audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.head_ref == 'chore/deps-latest-stable-2026-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: List outdated direct workspace dependencies
        run: pnpm outdated --recursive --format json || true

      - name: Audit exact Python dependency pins against PyPI
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          files = [
              Path("backend/requirements.txt"),
              Path("telemetry/requirements.txt"),
              Path("telemetry/requirements-dev.txt"),
              Path("scripts/requirements-home-lab.txt"),
          ]
          rows = []
          for path in files:
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("-r ") or "==" not in line:
                      continue
                  lhs, current = line.split("==", 1)
                  name = lhs.split("[", 1)[0].strip()
                  try:
                      with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json", timeout=20) as res:
                          latest = json.load(res)["info"]["version"]
                  except Exception as exc:
                      latest = f"ERROR:{type(exc).__name__}"
                  if current.strip() != latest:
                      rows.append({"file": str(path), "name": name, "current": current.strip(), "latest": latest})
          print("PYPI_OUTDATED_JSON=" + json.dumps(rows, sort_keys=True))
          PY
