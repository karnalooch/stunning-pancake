name: pnpm setup
description: Install pnpm and workspace dependencies from repo root
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22.23.2"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.4.2
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
