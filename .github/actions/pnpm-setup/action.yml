name: pnpm setup
description: Install pnpm and workspace dependencies from repo root
inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24.21.0"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        version: 12.4.2
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install workspace dependencies with bounded retry
      shell: bash
      run: |
        set -euo pipefail
        max_attempts=3
        for attempt in $(seq 1 "$max_attempts"); do
          echo "::group::pnpm install attempt ${attempt}/${max_attempts}"
          set +e
          pnpm install --frozen-lockfile
          status=$?
          set -e
          echo "::endgroup::"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "::error::pnpm install failed after ${max_attempts} attempts"
            exit "$status"
          fi

          delay=$((attempt * 10))
          echo "::warning::pnpm install failed with exit code ${status}; retrying in ${delay}s"
          sleep "$delay"
        done
