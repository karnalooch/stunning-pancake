version: 2

updates:
  # Security-only policy:
  # - ordinary Dependabot version-update PRs are disabled with
  #   open-pull-requests-limit: 0;
  # - Dependabot security updates remain enabled and are grouped per ecosystem;
  # - feature-driven upgrades are reviewed manually when they are useful to 4VELO.

  # Python backend (Django/FastAPI)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps)"

  # Python telemetry service (FastAPI)
  - package-ecosystem: pip
    directory: /telemetry
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 0
    groups:
      telemetry-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "telemetry"
    commit-message:
      prefix: "fix(deps)"

  # Node.js pnpm workspace (shared root lockfile)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 0
    groups:
      workspace-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "fix(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "fix(ci)"
