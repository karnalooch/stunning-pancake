apiVersion: skaffold/v2beta28
kind: Config
metadata:
  name: sport-platform
build:
  local:
    push: false
  artifacts:
    - image: localhost/sport-backend
      context: backend
      docker:
        dockerfile: Dockerfile
    - image: localhost/sport-owner
      context: .
      docker:
        dockerfile: admin/Dockerfile
deploy:
  kustomize:
    paths:
      - infrastructure/k8s/overlays/local
