<svg width="160" height="40" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- HD-2D Pixel Style Disciplines -->
  
  <!-- Run (Octopath Gold) -->
  <g transform="translate(10, 5)">
    <rect x="5" y="5" width="20" height="25" fill="#D4A373" stroke="#000000" stroke-width="1"/>
    <rect x="10" y="10" width="10" height="10" fill="#FFFFFF" opacity="0.5"/>
    <path d="M8 30H22" stroke="#000000" stroke-width="2"/>
  </g>
  
  <!-- Bike (Metal Slug Orange) -->
  <g transform="translate(50, 5)">
    <circle cx="10" cy="25" r="8" fill="#FF6B35" stroke="#000000" stroke-width="1"/>
    <circle cx="30" cy="25" r="8" fill="#FF6B35" stroke="#000000" stroke-width="1"/>
    <rect x="10" y="15" width="20" height="2" fill="#000000"/>
  </g>
  
  <!-- Swim (Deep Sea Blue) -->
  <g transform="translate(90, 5)">
    <path d="M5 20H35V30H5V20Z" fill="#0B1D33" stroke="#000000" stroke-width="1"/>
    <rect x="10" y="22" width="5" height="2" fill="#2EC4B6"/>
    <rect x="20" y="22" width="5" height="2" fill="#2EC4B6"/>
  </g>
  
  <!-- Gym (Matrix Cyan) -->
  <g transform="translate(130, 5)">
    <rect x="5" y="10" width="8" height="20" fill="#2EC4B6" stroke="#000000" stroke-width="1"/>
    <rect x="27" y="10" width="8" height="20" fill="#2EC4B6" stroke="#000000" stroke-width="1"/>
    <rect x="13" y="18" width="14" height="4" fill="#000000"/>
  </g>
</svg>
