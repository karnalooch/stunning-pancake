<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GPS Status (Satellite) -->
  <g transform="translate(10, 5)">
    <rect x="10" y="5" width="10" height="10" fill="#2EC4B6" stroke="#000000" stroke-width="1"/>
    <rect x="5" y="15" width="20" height="5" fill="#2EC4B6" stroke="#000000" stroke-width="1"/>
    <rect x="12" y="20" width="6" height="10" fill="#000000" opacity="0.3"/>
  </g>
  
  <!-- Heart Rate (Pixel Heart) -->
  <g transform="translate(45, 5)">
    <path d="M5 10H10V5H20V10H25V20H20V25H15V30H10V25H5V10Z" fill="#FF4B4B" stroke="#000000" stroke-width="2"/>
    <rect x="10" y="10" width="5" height="5" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Battery / Energy -->
  <g transform="translate(85, 5)">
    <rect x="2" y="10" width="26" height="14" fill="#0B1D33" stroke="#000000" stroke-width="2"/>
    <rect x="28" y="13" width="3" height="8" fill="#000000"/>
    <rect x="5" y="13" width="15" height="8" fill="#00FF94"/>
  </g>
</svg>
