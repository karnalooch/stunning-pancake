<svg width="240" height="80" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- HD-2D ATHLETE SPRITE LIBRARY -->
  
  <!-- RUNNER (Idle) -->
  <g id="runner_idle" transform="translate(10, 10)">
    <rect x="5" y="5" width="10" height="10" fill="#F4F1DE" stroke="#000000" stroke-width="1"/> <!-- Head -->
    <rect x="2" y="15" width="16" height="20" fill="#D4A373" stroke="#000000" stroke-width="1"/> <!-- Body -->
    <rect x="5" y="35" width="4" height="10" fill="#000000"/> <!-- Leg L -->
    <rect x="11" y="35" width="4" height="10" fill="#000000"/> <!-- Leg R -->
  </g>

  <!-- RUNNER (Action/Sprint) -->
  <g id="runner_sprint" transform="translate(50, 10)">
    <rect x="10" y="5" width="10" height="10" fill="#F4F1DE" stroke="#000000" stroke-width="1"/> <!-- Head tilted -->
    <rect x="5" y="15" width="20" height="15" fill="#D4A373" stroke="#000000" stroke-width="1"/> <!-- Body forward -->
    <path d="M5 30L0 40M25 30L30 40" stroke="#000000" stroke-width="2"/> <!-- Legs in motion -->
    <path d="M25 15L32 20M5 15L-2 20" stroke="#000000" stroke-width="2"/> <!-- Arms -->
  </g>

  <!-- CYCLIST (Action) -->
  <g id="cyclist_action" transform="translate(100, 10)">
    <circle cx="10" cy="40" r="8" fill="#FF6B35" stroke="#000000" stroke-width="1"/> <!-- Wheel L -->
    <circle cx="35" cy="40" r="8" fill="#FF6B35" stroke="#000000" stroke-width="1"/> <!-- Wheel R -->
    <path d="M10 40L22 25L35 40" stroke="#000000" stroke-width="2"/> <!-- Frame -->
    <rect x="18" y="15" width="8" height="8" fill="#F4F1DE" stroke="#000000" stroke-width="1"/> <!-- Head -->
  </g>

  <!-- GHOST ATHLETE (Shadow/Previous Best) -->
  <g id="ghost_sprite" transform="translate(160, 10)" opacity="0.4">
    <rect x="5" y="5" width="10" height="10" fill="#2EC4B6" stroke="#000000" stroke-width="1"/>
    <rect x="2" y="15" width="16" height="20" fill="#2EC4B6" stroke="#000000" stroke-width="1"/>
    <rect x="5" y="35" width="4" height="10" fill="#000000"/>
    <rect x="11" y="35" width="4" height="10" fill="#000000"/>
    <path d="M0 25L-5 35M20 25L25 35" stroke="#2EC4B6" stroke-width="1" stroke-dasharray="2 2"/> <!-- Trailing blur -->
  </g>

  <!-- BOSS / ELITE ATHLETE (Golden Aura) -->
  <g id="elite_sprite" transform="translate(200, 10)">
    <rect x="5" y="5" width="10" height="10" fill="#FFD166" stroke="#000000" stroke-width="1"/>
    <rect x="2" y="15" width="16" height="20" fill="#FFD166" stroke="#000000" stroke-width="1"/>
    <path d="M10 0L13 3L7 3L10 0Z" fill="#FFD166"/> <!-- Mini Crown -->
  </g>

  <text x="10" y="70" font-family="monospace" font-size="8" fill="#FFFFFF">HD-2D SPRITE LIBRARY V1.0 - ATHLETE CLASSES</text>
</svg>
