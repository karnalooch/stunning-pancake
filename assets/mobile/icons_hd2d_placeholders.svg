<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- HD-2D Sprite Style Guide Placeholder -->
  <defs>
    <filter id="pixelate" x="0" y="0">
      <feFlood flood-color="#000000" result="bg" />
      <feComposite in="SourceGraphic" in2="bg" operator="over" />
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="256" height="256" fill="#0B1D33" />
  
  <!-- Example Sprite Placeholder: Runner -->
  <g id="sprite_runner" transform="translate(32, 32)">
    <rect x="10" y="10" width="44" height="44" fill="#D4A373" stroke="#000000" stroke-width="2" />
    <text x="12" y="35" font-family="monospace" font-size="8" fill="#000000">RUNNER</text>
  </g>
  
  <!-- Example Sprite Placeholder: Ghost -->
  <g id="sprite_ghost" transform="translate(96, 32)">
    <rect x="10" y="10" width="44" height="44" fill="#2EC4B6" stroke="#000000" stroke-width="2" />
    <text x="12" y="35" font-family="monospace" font-size="8" fill="#000000">GHOST</text>
  </g>
  
  <!-- Example Sprite Placeholder: Trophy -->
  <g id="sprite_trophy" transform="translate(160, 32)">
    <rect x="10" y="10" width="44" height="44" fill="#FFD166" stroke="#000000" stroke-width="2" />
    <text x="12" y="35" font-family="monospace" font-size="8" fill="#000000">TROPHY</text>
  </g>

  <text x="20" y="240" font-family="sans-serif" font-size="12" fill="#FFFFFF">HD-2D Visual Manifest V3.0 - Placeholder Sprites</text>
</svg>
